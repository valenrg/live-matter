<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tide of Edits</title>
<style>
:root{
  /* Layout: full-screen canvas on the ink wall, editorial placard bottom-left, one control bottom-right.
     Tokens from the Valentina Contini design system v1 (verified values). Single dark world by choice. */
  --vc-ink:#17141B;
  --vc-paper:#F7F5F2;
  --vc-muted:#D6CEDD;
  --vc-violet:#CFAFF4;
  --vc-magenta:#FF38D1;
  --vc-line:rgba(247,245,242,.24);
  --font-display:"Glacial Indifference","Avenir Next","Century Gothic","Trebuchet MS",sans-serif;
  --font-body:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--vc-ink);color:var(--vc-paper);overflow:hidden}
body{font-family:var(--font-body);font-size:13px;line-height:1.45}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.ui{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;padding:clamp(16px,3vw,32px);pointer-events:none;transition:opacity .65s ease}
.ui.idle{opacity:0}
.placard{pointer-events:none;max-width:60ch;display:flex;flex-direction:column;gap:6px}
.eyebrow{margin:0;font-family:var(--font-body);font-weight:700;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--vc-violet)}
.placard h1{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4vw,44px);line-height:.92;letter-spacing:-.045em;margin:0;text-wrap:balance}
.meta{margin:0;font-family:var(--font-mono);font-size:11px;color:var(--vc-muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;background:var(--vc-muted);flex:none}
.dot.live{background:var(--vc-magenta)}
.tick{margin:0;font-family:var(--font-mono);font-size:11px;color:var(--vc-paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(60ch,calc(100vw - 32px))}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:auto}
.btn{font-family:var(--font-body);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:10px;min-height:44px;padding:0 18px;color:var(--vc-paper);background:rgba(23,20,27,.72);border:1px solid var(--vc-line);border-radius:0;cursor:pointer;transition:background .22s ease,color .22s ease,border-color .22s ease}
.btn:hover{background:var(--vc-paper);color:var(--vc-ink);border-color:var(--vc-paper)}
.btn:focus-visible{outline:2px solid var(--vc-violet);outline-offset:3px}
.btn[hidden]{display:none}
.fallback{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;background:radial-gradient(circle at 40% 40%,#6D23C8,#3C166D 45%,#17141B 78%)}
.fallback p{max-width:40ch;background:var(--vc-ink);padding:16px 20px;border:1px solid var(--vc-line)}
@media (prefers-reduced-motion:reduce){.ui,.btn{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Generative artwork: a vast liquid surface where every Wikipedia edit falls as a drop"></canvas>
<div class="fallback" id="fallback"><p>This piece needs WebGL 2, which this browser did not provide. Open it in a current version of Safari, Chrome or Firefox.</p></div>

<div class="ui" id="ui">
  <div class="placard">
    <p class="eyebrow">Surface waves &middot; live data</p>
    <h1>Tide of Edits</h1>
    <p class="meta"><span class="dot" id="dot"></span><span id="status">Connecting to Wikipedia</span> &middot; <span id="rate">0</span> edits/s</p>
    <p class="tick" id="tick">&nbsp;</p>
  </div>
  <div class="controls">
    <a class="btn back" href="../" style="display:inline-flex;align-items:center;text-decoration:none">&larr; Live Matter</a>
    <button class="btn" id="fsBtn" type="button" hidden>Full screen</button>
  </div>
</div>

<script>
(function(){
'use strict';
var canvas=document.getElementById('c');
var gl=canvas.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
if(!gl){document.getElementById('fallback').style.display='grid';return;}

/* Tide of Edits, surface study: the pigment is now the floor of a vast, shallow liquid seen in perspective.
   Every Wikipedia edit is a drop falling on it. Rings spread and interfere, and the colours beneath bend
   through them like light through water. Bytes added fall as crests, bytes removed as troughs. */
var VS='#version 300 es\nin vec2 aPos;out vec2 vUv;void main(){vUv=aPos*.5+.5;gl_Position=vec4(aPos,0.,1.);}';
var NOISE=[
'float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}',
'vec2 grad(vec2 i){float a=6.2831853*hash(i);return vec2(cos(a),sin(a));}',
'float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*f*(f*(f*6.-15.)+10.);',
' float v=mix(mix(dot(grad(i),f),dot(grad(i+vec2(1.,0.)),f-vec2(1.,0.)),u.x),mix(dot(grad(i+vec2(0.,1.)),f-vec2(0.,1.)),dot(grad(i+vec2(1.,1.)),f-vec2(1.,1.)),u.x),u.y);',
' return .5+.75*v;}',
'const mat2 R=mat2(.6,-.8,.8,.6);',
'float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*noise(p);p=R*p*2.03+17.1;a*=.5;}return s/.9375;}'
].join('\n');


/* Pass 1: the water. A damped wave equation; edits and fingers drop disturbances into it. */
var FS_WAVE=['#version 300 es','precision highp float;','in vec2 vUv;out vec4 o;',
'uniform sampler2D uPrev;uniform vec2 uTexel;uniform vec4 uDrops[8];uniform int uN;uniform float uDamp,uAsp;',
'void main(){',
' vec4 c=texture(uPrev,vUv);float h=c.r,hp=c.g;',
' float L=texture(uPrev,vUv-vec2(uTexel.x,0.)).r,R=texture(uPrev,vUv+vec2(uTexel.x,0.)).r;',
' float T=texture(uPrev,vUv+vec2(0.,uTexel.y)).r,B=texture(uPrev,vUv-vec2(0.,uTexel.y)).r;',
' float nh=(2.*h-hp+.48*(L+R+T+B-4.*h))*uDamp;',
' for(int i=0;i<8;i++){if(i>=uN)break;vec2 d=(vUv-uDrops[i].xy)*vec2(uAsp,1.);nh+=uDrops[i].z*exp(-dot(d,d)/uDrops[i].w);}',
' float e=min(min(vUv.x,1.-vUv.x),min(vUv.y,1.-vUv.y));nh*=mix(.93,1.,smoothstep(0.,.06,e));',
' o=vec4(clamp(nh,-4.,4.),h,0.,1.);',
'}'].join('\n');

/* Pass 2: the surface, seen from above at a low angle, dissolving into the dark with distance. */
var FS_SURF=['#version 300 es','precision highp float;','in vec2 vUv;out vec4 o;',
'uniform vec2 uRes;uniform float uT,uClock,uWarp,uHigh,uScale,uMoodPos,uMist,uMood,uFlash,uPitch,uYaw,uCamH;',
'uniform vec3 uPal[25];uniform sampler2D uWave;uniform vec4 uRect;uniform vec2 uWTex;',
NOISE,
'vec3 ramp(int m,float t){t=clamp(t,0.,1.)*4.;float fi=min(floor(t),3.);int i=m*5+int(fi);float fr=t-fi;fr=fr*fr*(3.-2.*fr);return mix(uPal[i],uPal[i+1],fr);}',
'void pigment(vec2 p,out vec3 col,out float h){',
' float t=uT;',
' vec2 q=vec2(fbm(p+vec2(0.,t*.10)),fbm(p+vec2(5.2,1.3)-vec2(t*.08,0.)));',
' vec2 r=vec2(fbm(p+3.4*q+vec2(1.7,9.2)+t*.06),fbm(p+3.4*q+vec2(8.3,2.8)-t*.05));',
' float big=noise(p*.38+vec2(t*.13,-t*.09));',
' float f=fbm(p+uWarp*r);',
' float streak=noise(r*4.2+q*2.+f*1.2+vec2(t*.05));',
' float fine=noise(r*7.+q*5.+vec2(-t*.04,t*.03));',
' float ridge=streak*streak*(3.-2.*streak);',
' h=(smoothstep(.15,.9,f)*.80+ridge*.06+fine*.03*(1.+2.5*uHigh))*mix(.55,1.18,big);',
' float tone=smoothstep(.16,.90,f*.92+streak*.16+(q.x-.5)*.22);',
' float lp=uMoodPos+(r.x-.5)*1.7+(big-.5)*1.0+(q.y-.5)*.6;',
' float m0=mod(floor(lp),4.);float w=smoothstep(0.,1.,fract(lp));',
' col=mix(ramp(int(m0),tone),ramp(int(mod(m0+1.,4.)),tone),w);',
' col=mix(col,ramp(4,tone),uMist*smoothstep(.25,.75,r.y));',
' col*=.84+.30*streak+.06*fine;',
' col+=uHigh*.18*fine*uPal[24];',
' col=col*mix(.86,1.08,uMood)+uFlash*.30*vec3(1.,.576,.898)*smoothstep(.45,.85,f);',
'}',
'float waveAt(vec2 u){vec2 e=min(u,1.-u);float m=smoothstep(0.,.08,min(e.x,e.y));return texture(uWave,u).r*m;}',
'void main(){',
' vec2 s=(gl_FragCoord.xy-.5*uRes)/uRes.y;',
' vec3 rd=normalize(vec3(s*1.05,1.));',
' float cp=cos(uPitch),sp=sin(uPitch);rd=vec3(rd.x,rd.y*cp-rd.z*sp,rd.y*sp+rd.z*cp);',
' float cy=cos(uYaw),sy=sin(uYaw);rd.xz=mat2(cy,-sy,sy,cy)*rd.xz;',
' vec3 ink=vec3(.0080,.0070,.0103);',
' vec3 haze=pow(uPal[7],vec3(2.2))*.025;',
' vec3 col;',
' if(rd.y>-.004){col=ink+haze*.4;}',
' else{',
'  float t=uCamH/-rd.y;vec3 P=vec3(0.,uCamH,0.)+rd*t;',
'  vec2 wu=(P.xz-uRect.xy)/uRect.zw;',
'  float wv=0.;vec2 g=vec2(0.);',
'  if(all(greaterThan(wu,vec2(0.)))&&all(lessThan(wu,vec2(1.)))){',
'   wv=waveAt(wu);',
'   g=vec2(waveAt(wu+vec2(uWTex.x,0.))-waveAt(wu-vec2(uWTex.x,0.)),waveAt(wu+vec2(0.,uWTex.y))-waveAt(wu-vec2(0.,uWTex.y)));',
'  }',
'  vec3 alb;float h;',
'  pigment(P.xz*uScale*.55+g*.35,alb,h);',
'  alb=pow(alb,vec3(2.2));',
'  float H=h*.065+wv*.03;',
'  vec3 Q=P+vec3(0.,H,0.);',
'  float ex=.012*(1.+t*.5);vec3 c1;float h1,h2;',
'  pigment((P.xz+vec2(ex,0.))*uScale*.55+g*.35,c1,h1);pigment((P.xz+vec2(0.,ex))*uScale*.55+g*.35,c1,h2);',
'  vec3 n=normalize(vec3(-(h1-h)*.065/ex,1.,-(h2-h)*.065/ex));',
'  vec3 gn=normalize(vec3(-g.x*3.,1.,-g.y*3.));n=normalize(mix(n,gn,.6));',
'  vec3 L=normalize(vec3(-.35,.42,1.));',
'  vec3 V=-rd;vec3 Hh=normalize(L+V);',
'  float dif=clamp(dot(n,L)*.55+.45,0.,1.);',
'  float nh=max(dot(n,Hh),0.);',
'  float spec=pow(nh,90.)*1.4+pow(nh,16.)*.10;',
'  float fr=pow(1.-max(dot(n,V),0.),4.);',
'  vec3 sheen=mix(vec3(.72,.42,1.),vec3(1.,.58,.9),.5+.5*cos(6.2831*(h*.6+fr)));',
'  float ao=mix(.35,1.,smoothstep(0.,.75,h));',
'  col=alb*(.18+.95*dif)*ao+spec*vec3(.97,.96,.95)+fr*sheen*.10;',
'  float fog=exp(-max(t-1.2,0.)*.42);',
'  col=mix(ink+haze,col,fog);',
' }',
' col*=1.3;',
' col=clamp((col*(2.51*col+.03))/(col*(2.43*col+.59)+.14),0.,1.);',
' col=pow(col,vec3(1./2.2));',
' vec2 vv=vUv-.5;col*=1.-.32*dot(vv,vv)*2.;',
' col+=(hash(gl_FragCoord.xy*1.37+fract(uClock*1.7)*91.)-.5)*.03;',
' o=vec4(col,1.);',
'}'].join('\n');

function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s));throw new Error('shader');}return s;}
function prog(fs){var p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));
  gl.bindAttribLocation(p,0,'aPos');gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){console.error(gl.getProgramInfoLog(p));throw new Error('link');}
  var u={},n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(var i=0;i<n;i++){var info=gl.getActiveUniform(p,i);u[info.name]=gl.getUniformLocation(p,info.name);}
  return {p:p,u:u};}


var pWave,pField;
try{pWave=prog(FS_WAVE);pField=prog(FS_SURF);}
catch(err){document.getElementById('fallback').style.display='grid';return;}

/* Palette: Valentina Contini brand, expanded into five moods, each a ramp from shadow to highlight.
   Verified brand colours are marked (v); the rest are proposed extensions within the same purple-to-magenta family.
   The first four moods drift into one another; Mist is the muted mood that bot edits bring in. */
var MOODS=[
  /* Ultraviolet */ ['#1B1747','#4630D9','#6D23C8'/*v*/,'#B86CFF'/*v*/,'#E7DDF4'/*v*/],
  /* Signature   */ ['#3C166D'/*v*/,'#6D23C8'/*v*/,'#B86CFF'/*v*/,'#CFAFF4'/*v*/,'#F7F5F2'/*v*/],
  /* Lab         */ ['#4A0B3F','#9D006C'/*v*/,'#FF38D1'/*v*/,'#FF93E5'/*v*/,'#F7F5F2'/*v*/],
  /* Ember       */ ['#3C166D'/*v*/,'#D6246E','#FF5C7A','#FFB8A8','#F7F5F2'/*v*/],
  /* Mist        */ ['#17141B'/*v*/,'#3C166D'/*v*/,'#B8AAC9'/*v*/,'#D6CEDD'/*v*/,'#F7F5F2'/*v*/]
];
(function(){
  var a=[];
  MOODS.forEach(function(m){m.forEach(function(h){var n=parseInt(h.slice(1),16);a.push((n>>16&255)/255,(n>>8&255)/255,(n&255)/255);});});
  gl.useProgram(pField.p);gl.uniform3fv(pField.u['uPal[0]'],new Float32Array(a));
})();


var vbo=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

/* Half-float targets where the device allows them, 8-bit otherwise. */
gl.getExtension('EXT_color_buffer_float');gl.getExtension('EXT_color_buffer_half_float');
var useFloat=true;
function makeTarget(w,h){
  var tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
  if(useFloat)gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);
  else gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  var fb=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  var ok=gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE;
  if(!ok&&useFloat){useFloat=false;gl.deleteTexture(tex);gl.deleteFramebuffer(fb);return makeTarget(w,h);}
  gl.viewport(0,0,w,h);gl.clearColor(.5,.5,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
  return {tex:tex,fb:fb,w:w,h:h};
}

/* the patch of water the drops fall into, in world units (x across, z away from the viewer) */
var RECT=[-3.4,.35,6.8,5.6],WW=360,WH=Math.round(360*RECT[3]/RECT[2]);
var waveA=makeTarget(WW,WH),waveB=makeTarget(WW,WH);
[waveA,waveB].forEach(function(t){gl.bindFramebuffer(gl.FRAMEBUFFER,t.fb);gl.viewport(0,0,WW,WH);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);});

var W=1,H=1,SC=1;
function resize(){
  var dpr=Math.min(window.devicePixelRatio||1,1.5);
  var w=Math.max(1,Math.round(canvas.clientWidth*dpr)),h=Math.max(1,Math.round(canvas.clientHeight*dpr));
  if(w===W&&h===H)return;W=w;H=h;canvas.width=w;canvas.height=h;
}
window.addEventListener('resize',resize);resize();

/* camera */
var cam={pitch:.50,yaw:0,h:1.0};
function pointToWave(cx,cy){
  var r=canvas.getBoundingClientRect();
  var sx=((cx-r.left)-r.width/2)/r.height,sy=-((cy-r.top)-r.height/2)/r.height;
  var d=[sx*1.05,sy*1.05,1],l=Math.hypot(d[0],d[1],d[2]);d=[d[0]/l,d[1]/l,d[2]/l];
  var cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);d=[d[0],d[1]*cp-d[2]*sp,d[1]*sp+d[2]*cp];
  var cy2=Math.cos(cam.yaw),sy2=Math.sin(cam.yaw);d=[cy2*d[0]-sy2*d[2],d[1],sy2*d[0]+cy2*d[2]];
  if(d[1]>=-.01)return null;
  var t=cam.h/-d[1],x=d[0]*t,z=d[2]*t;
  return [(x-RECT[0])/RECT[2],(z-RECT[1])/RECT[3]];
}
/* Pointer: a finger drawn across the water leaves a wake. */
var pt={uv:null,down:false,look:[0,0],acc:0};
canvas.addEventListener('pointerdown',function(ev){pt.down=true;pt.uv=pointToWave(ev.clientX,ev.clientY);pt.acc=.5;wake();});
canvas.addEventListener('pointermove',function(ev){
  wake();
  var r=canvas.getBoundingClientRect();pt.look=[((ev.clientX-r.left)/r.width-.5)*2,((ev.clientY-r.top)/r.height-.5)*2];
  if(ev.pointerType!=='mouse'&&!pt.down)return;
  var u=pointToWave(ev.clientX,ev.clientY);
  if(u&&pt.uv){pt.acc+=Math.hypot(u[0]-pt.uv[0],u[1]-pt.uv[1])*8;}
  pt.uv=u;
});
function up(){pt.down=false;}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);

/* Data: every edit made to any Wikipedia, as it happens (Wikimedia EventStreams, free and keyless).
   Each edit falls in its language's own region of the water. Bytes added fall as crests, bytes removed as troughs.
   Edit rate drives speed and storminess, the mix of languages drives colour, the human/bot balance drives brightness. */
var statusEl=document.getElementById('status'),rateEl=document.getElementById('rate'),tickEl=document.getElementById('tick');
var snd={level:0,slow:0,high:0,pitch:.5,energy:0};
var feed={q:[],count:0,rate:0,mean:6,human:.6,hx:1,hy:0,flash:0,live:false,sim:false,lastTick:0,shown:0};
var STREAM='https://stream.wikimedia.org/v2/stream/recentchange';
function h32(str){var h=2166136261;for(var i=0;i<str.length;i++)h=Math.imul(h^str.charCodeAt(i),16777619);return (h>>>0)/4294967296;}
function onEdit(wiki,title,delta,bot,isNew){
  feed.count++;
  var a=h32(wiki),b=h32(wiki+'/y');
  var mag=Math.min(1,Math.log(1+Math.abs(delta))/9);
  if(feed.q.length<40)feed.q.push([.18+.64*a+(Math.random()-.5)*.36,.18+.64*b+(Math.random()-.5)*.36,(.02+.14*mag)*(delta<0?-1:1)]);
  feed.human+=((bot?0:1)-feed.human)*.02;
  var w=.012*(.4+mag),ang=a*6.2831;
  feed.hx+=(Math.cos(ang)-feed.hx)*w;feed.hy+=(Math.sin(ang)-feed.hy)*w;
  if(isNew)feed.flash=Math.max(feed.flash,.5);
  var now=performance.now();
  if(title&&now-feed.lastTick>900){feed.lastTick=now;
    tickEl.textContent=wiki+' · '+title+' · '+(delta>=0?'+':'−')+Math.abs(delta)+' bytes'+(bot?' · bot':'');}
}
var es=null,simTimer=null;
function startSim(){
  if(feed.sim||feed.live)return;feed.sim=true;
  statusEl.textContent='Preview with simulated edits';
  tickEl.textContent='This view cannot reach Wikipedia. Open the downloaded file for the live stream.';
  var langs=['en','en','en','en','de','de','fr','fr','es','es','ja','ru','it','zh','pt','ar','nl','pl','uk','fa','sv','ko','tr','id','he','vi','cs'];
  (function tick(){
    if(!feed.sim)return;
    var t=performance.now()/1000,r=7+5*Math.sin(t*.11)+3*Math.sin(t*.37);
    var d=Math.round(Math.exp(Math.random()*8))*(Math.random()<.3?-1:1);
    onEdit(langs[Math.floor(Math.random()*langs.length)],'',d,Math.random()<.25,Math.random()<.04);
    simTimer=setTimeout(tick,-Math.log(1-Math.random())*1000/Math.max(1,r));
  })();
}
function connect(){
  try{
    es=new EventSource(STREAM);
    es.onopen=function(){feed.live=true;feed.sim=false;clearTimeout(simTimer);statusEl.textContent='Live from Wikipedia';document.getElementById('dot').classList.add('live');};
    es.onmessage=function(m){
      var d;try{d=JSON.parse(m.data);}catch(e){return;}
      if(!d||(d.type!=='edit'&&d.type!=='new'))return;
      if(d.meta&&d.meta.domain==='canary')return;
      var sn=d.server_name||'';if(sn.indexOf('.wikipedia.org')<0)return;
      var len=d.length||{};
      onEdit(sn.split('.')[0],String(d.title||''),(len['new']||0)-(len.old||0),!!d.bot,d.type==='new');
    };
    es.onerror=function(){
      if(feed.live){feed.live=false;statusEl.textContent='Reconnecting to Wikipedia';document.getElementById('dot').classList.remove('live');}
      else startSim();
    };
  }catch(e){startSim();}
  setTimeout(function(){if(!feed.live)startSim();},8000);
}
connect();
function readAudio(dt){
  if(dt>0){feed.rate+=(feed.count/dt-feed.rate)*.02;}feed.count=0;
  feed.mean+=(feed.rate-feed.mean)*.0015;
  var lvl=Math.max(0,Math.min(1,.4+(feed.rate-feed.mean)/Math.max(2,feed.mean)*1.3));
  snd.level+=(lvl-snd.level)*.03;
  snd.energy+=(Math.min(1,feed.rate/22)-snd.energy)*.006;
  snd.pitch+=((Math.atan2(feed.hy,feed.hx)/6.2831+.5)-snd.pitch)*.01;
  snd.slow=feed.human*.8;
  snd.high+=((1-feed.human)*.6-snd.high)*.02;
  if(++feed.shown%20===0)rateEl.textContent=feed.rate.toFixed(1);
}

/* Full screen, where the browser offers it. */
var fsBtn=document.getElementById('fsBtn'),root=document.documentElement;
if(root.requestFullscreen&&document.fullscreenEnabled){
  fsBtn.hidden=false;
  fsBtn.addEventListener('click',function(){
    try{var pr=document.fullscreenElement?document.exitFullscreen():root.requestFullscreen();if(pr&&pr.catch)pr.catch(function(){});}catch(e){}
  });
  document.addEventListener('fullscreenchange',function(){fsBtn.textContent=document.fullscreenElement?'Exit full screen':'Full screen';});
}

/* Controls fade when untouched. */
var ui=document.getElementById('ui'),idleTimer=null;
function wake(){ui.classList.remove('idle');clearTimeout(idleTimer);idleTimer=setTimeout(function(){if(!ui.matches(':focus-within'))ui.classList.add('idle');},6000);}
document.addEventListener('keydown',wake);ui.addEventListener('pointerdown',wake);wake();


var calm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var phase=Math.random()*200,clock=Math.random()*900,last=performance.now();
var langPos=1,flash=0,flashT=0,nextRain=2;
function drift(t,k){return .5+.25*Math.sin(t*.031*k+k*1.7)+.15*Math.sin(t*.0173*k+k*4.1)+.10*Math.sin(t*.071*k+k*.6);}
var drops=new Float32Array(32);

function frame(now){
  requestAnimationFrame(frame);
  resize();
  var dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  readAudio(dt);
  var slowF=calm?.3:1;
  phase+=dt*(.30+.35*drift(clock,1.3)+snd.level*.35+snd.energy*1.2)*slowF;
  flashT*=Math.pow(.2,dt);flash+=(flashT-flash)*.05;
  if(feed.flash>0){flashT=Math.max(flashT,feed.flash);feed.flash=0;}
  /* gather this frame's drops: edits first, then a finger's wake, then a light rain when the stream is quiet */
  var n=0;
  while(feed.q.length&&n<6){
    var ed=feed.q.shift(),a=Math.abs(ed[2]);
    drops[n*4]=ed[0];drops[n*4+1]=ed[1];drops[n*4+2]=(ed[2]<0?-1:1)*(.3+a*3.2);drops[n*4+3]=.00003+a*.00022;n++;
  }
  if(pt.uv&&pt.acc>0&&n<8){
    var amp=Math.min(.6,pt.acc*.25);
    drops[n*4]=pt.uv[0];drops[n*4+1]=pt.uv[1];drops[n*4+2]=amp;drops[n*4+3]=.00005;n++;pt.acc=0;
  }
  nextRain-=dt;
  if(nextRain<=0&&n<8&&!calm){
    drops[n*4]=.1+Math.random()*.8;drops[n*4+1]=.1+Math.random()*.8;drops[n*4+2]=(Math.random()<.5?-1:1)*(.12+Math.random()*.2);drops[n*4+3]=.00003;n++;
    nextRain=feed.rate>1?2+Math.random()*4:.4+Math.random()*1.2;
  }
  var scale=(1.7+1.6*drift(clock,1.0))*(1+snd.energy*.35);
  var warp=(2.3+2.2*drift(clock,2.1))*(1+snd.energy*.5);
  var langT=Math.atan2(feed.hy,feed.hx)/6.2831*4,dl=langT-langPos;dl-=4*Math.round(dl/4);langPos+=dl*.006;
  var moodPos=langPos+clock*.0035+(drift(clock,3.7)-.5)*1.1+.5;
  var mist=Math.max(0,Math.min(.7,(1-feed.human-.12)*1.8));
  var mood=Math.min(1,drift(clock,5.3)+snd.slow*.4);
  var sway=calm?.3:1;
  cam.yaw+=((Math.sin(clock*.021)*.10*sway+pt.look[0]*.06)-cam.yaw)*.02;
  cam.pitch+=((.50+Math.sin(clock*.017+1.)*.05*sway-pt.look[1]*.04)-cam.pitch)*.02;
  cam.h=1.0+Math.sin(clock*.013)*.08*sway;

  gl.disable(gl.BLEND);
  /* two wave steps per frame; drops only in the first */
  for(var s=0;s<2;s++){
    gl.bindFramebuffer(gl.FRAMEBUFFER,waveB.fb);gl.viewport(0,0,WW,WH);
    gl.useProgram(pWave.p);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,waveA.tex);
    gl.uniform1i(pWave.u.uPrev,0);gl.uniform2f(pWave.u.uTexel,1/WW,1/WH);gl.uniform1f(pWave.u.uAsp,RECT[2]/RECT[3]);
    gl.uniform1f(pWave.u.uDamp,.9965);gl.uniform1i(pWave.u.uN,s===0?n:0);
    gl.uniform4fv(pWave.u['uDrops[0]'],drops);
    gl.drawArrays(gl.TRIANGLES,0,3);
    var tw=waveA;waveA=waveB;waveB=tw;
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);
  gl.useProgram(pField.p);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,waveA.tex);
  var u=pField.u;
  gl.uniform1i(u.uWave,0);gl.uniform4f(u.uRect,RECT[0],RECT[1],RECT[2],RECT[3]);gl.uniform2f(u.uWTex,1.5/WW,1.5/WH);
  gl.uniform2f(u.uRes,W,H);gl.uniform1f(u.uT,phase);gl.uniform1f(u.uClock,clock);
  gl.uniform1f(u.uWarp,warp);gl.uniform1f(u.uHigh,snd.high);gl.uniform1f(u.uScale,scale);gl.uniform1f(u.uMoodPos,moodPos);
  gl.uniform1f(u.uMist,mist);gl.uniform1f(u.uMood,mood);gl.uniform1f(u.uFlash,flash);
  gl.uniform1f(u.uPitch,cam.pitch);gl.uniform1f(u.uYaw,cam.yaw);gl.uniform1f(u.uCamH,cam.h);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
requestAnimationFrame(frame);
})();
</script>
