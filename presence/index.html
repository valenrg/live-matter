<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presence</title>
<meta name="description" content="A room of slow smoke that only you can disturb. The camera sees movement only; nothing is recorded.">
<meta name="theme-color" content="#08080b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: full-screen canvas, museum placard bottom-left, quiet controls bottom-right. Single dark world by choice. */
  --wall:#08080b;
  --ink:#ecebf2;
  --ink-dim:#8d8b9c;
  --line:rgba(236,235,242,.18);
  --glass:rgba(14,14,20,.55);
  --accent:#e9dcff;
  --font-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --font-body:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--wall);color:var(--ink);overflow:hidden}
body{font-family:var(--font-body);font-size:12px;line-height:1.4}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.ui{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;padding:16px;pointer-events:none;transition:opacity .8s ease}
.ui.idle{opacity:0}
.placard{pointer-events:none;max-width:62ch;display:flex;flex-direction:column;gap:5px}
.placard h1{font-family:var(--font-display);font-style:italic;font-weight:400;font-size:26px;line-height:1;margin:0 0 2px;letter-spacing:.01em}
.placard p{margin:0;color:var(--ink-dim);letter-spacing:.04em;text-transform:uppercase;font-size:10px;font-variant-numeric:tabular-nums}
.placard p.read{color:var(--ink);text-transform:none;letter-spacing:.02em;font-size:11px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:auto}
.btn{font:inherit;font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:10px;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[hidden]{display:none}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.fallback{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;background:#08080b}
.fallback p{max-width:40ch;background:var(--glass);padding:14px 18px;border-radius:12px;border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.ui{transition:none}}

</style>
</head>
<body>
<canvas id="c" aria-label="Generative artwork: pale smoke drifting in a dark room, stirred by the visitor's movement"></canvas>
<div class="fallback" id="fallback"><p id="fallbackText">This piece needs WebGL 2, which this browser did not provide. Open it in a current version of Safari, Chrome or Firefox.</p></div>

<div class="ui" id="ui">
  <div class="placard">
    <h1>Presence</h1>
    <p><span id="status">Move your pointer or finger through the smoke</span></p>
  </div>
  <div class="controls">
    <a class="btn back" href="../">&larr; Live Matter</a>
    <button class="btn" id="camBtn" type="button" hidden>Use camera</button>
    <button class="btn" id="fsBtn" type="button" hidden>Full screen</button>
  </div>
</div>

<script>
(function(){
'use strict';
/* Shared: full screen where the browser offers it, controls that fade when untouched. */
var fsBtn=document.getElementById('fsBtn'),root=document.documentElement;
if(root.requestFullscreen&&document.fullscreenEnabled){
  fsBtn.hidden=false;
  fsBtn.addEventListener('click',function(){
    try{var pr=document.fullscreenElement?document.exitFullscreen():root.requestFullscreen();if(pr&&pr.catch)pr.catch(function(){});}catch(e){}
  });
  document.addEventListener('fullscreenchange',function(){fsBtn.textContent=document.fullscreenElement?'Exit full screen':'Full screen';});
}
var ui=document.getElementById('ui'),idleTimer=null;
function wake(){ui.classList.remove('idle');clearTimeout(idleTimer);idleTimer=setTimeout(function(){if(!ui.matches(':focus-within'))ui.classList.add('idle');},6000);}
window.__wake=wake;
document.addEventListener('keydown',wake);document.addEventListener('pointermove',wake);document.addEventListener('pointerdown',wake);wake();
window.__fail=function(msg){if(msg)document.getElementById('fallbackText').textContent=msg;document.getElementById('fallback').style.display='grid';};
window.__framed=(function(){try{return window.self!==window.top;}catch(e){return true;}})();
})();
</script>
<script>
(function(){
'use strict';
/* Presence: a room of slow smoke that only you can disturb. With the camera on, the piece sees movement and
   nothing else: each frame is shrunk to a tiny grid of brightness, compared with the one before, and thrown away.
   Where something moved, smoke is released and pushed the way the movement went. No image is kept, shown or sent.
   Without a camera, your pointer or finger stirs it, and a few slow drafts keep the room alive. */

var canvas=document.getElementById('c');
var gl=canvas.getContext('webgl2',{antialias:false,alpha:false,depth:false,stencil:false,powerPreference:'high-performance'});
if(!gl){window.__fail();return;}
var statusEl=document.getElementById('status'),camBtn=document.getElementById('camBtn');
var hasFloat=!!gl.getExtension('EXT_color_buffer_float')||!!gl.getExtension('EXT_color_buffer_half_float');
if(!hasFloat){window.__fail('This piece needs a browser that can render to floating-point textures. Try a current desktop Chrome, Edge, Firefox or Safari.');return;}

var VS=['#version 300 es','precision highp float;','in vec2 aPos;uniform vec2 uTexel;',
'out vec2 vUv,vL,vR,vT,vB;',
'void main(){vUv=aPos*.5+.5;vL=vUv-vec2(uTexel.x,0.);vR=vUv+vec2(uTexel.x,0.);vT=vUv+vec2(0.,uTexel.y);vB=vUv-vec2(0.,uTexel.y);gl_Position=vec4(aPos,0.,1.);}'].join('\n');
var HEAD='#version 300 es\nprecision highp float;precision highp sampler2D;\nin vec2 vUv,vL,vR,vT,vB;out vec4 o;\n';
var FS={
splat:HEAD+'uniform sampler2D uTarget;uniform float uAspect,uRadius;uniform vec3 uColor;uniform vec2 uPoint;\nvoid main(){vec2 p=vUv-uPoint;p.x*=uAspect;vec3 s=exp(-dot(p,p)/uRadius)*uColor;o=vec4(texture(uTarget,vUv).xyz+s,1.);}',
motion:HEAD+'uniform sampler2D uTarget,uCur,uPrev;uniform vec2 uCamTexel,uCamScale;uniform float uK,uMode;uniform vec3 uColor;\n'+
 'float D(vec2 c){return texture(uCur,c).r-texture(uPrev,c).r;}\n'+
 'void main(){vec2 c=(vUv-.5)*uCamScale+.5;vec4 b=texture(uTarget,vUv);\n'+
 ' if(any(lessThan(c,vec2(0.)))||any(greaterThan(c,vec2(1.)))){o=b;return;}\n'+
 ' float m=texture(uCur,c).r;\n'+
 ' if(uMode<.5){vec2 e=uCamTexel*1.5;vec2 g=vec2(D(c+vec2(e.x,0.))-D(c-vec2(e.x,0.)),D(c+vec2(0.,e.y))-D(c-vec2(0.,e.y)));o=vec4(b.xy+g*uK+vec2(0.,m*uK*.04),0.,1.);}\n'+
 ' else{o=vec4(b.rgb+uColor*m*uK,1.);}}',
advect:HEAD+'uniform sampler2D uVelocity,uSource;uniform vec2 uVelTexel;uniform float uDt,uDiss;\nvoid main(){vec2 c=vUv-uDt*texture(uVelocity,vUv).xy*uVelTexel;o=texture(uSource,c)/(1.+uDiss*uDt);}',
divergence:HEAD+'uniform sampler2D uVelocity;\nvoid main(){float L=texture(uVelocity,vL).x,R=texture(uVelocity,vR).x,T=texture(uVelocity,vT).y,B=texture(uVelocity,vB).y;vec2 C=texture(uVelocity,vUv).xy;\n if(vL.x<0.)L=-C.x;if(vR.x>1.)R=-C.x;if(vT.y>1.)T=-C.y;if(vB.y<0.)B=-C.y;o=vec4(.5*(R-L+T-B),0.,0.,1.);}',
curl:HEAD+'uniform sampler2D uVelocity;\nvoid main(){float L=texture(uVelocity,vL).y,R=texture(uVelocity,vR).y,T=texture(uVelocity,vT).x,B=texture(uVelocity,vB).x;o=vec4(.5*(R-L-T+B),0.,0.,1.);}',
vorticity:HEAD+'uniform sampler2D uVelocity,uCurl;uniform float uCurlK,uDt,uBuoy;uniform sampler2D uDye;\nvoid main(){float L=texture(uCurl,vL).x,R=texture(uCurl,vR).x,T=texture(uCurl,vT).x,B=texture(uCurl,vB).x,C=texture(uCurl,vUv).x;\n vec2 f=.5*vec2(abs(T)-abs(B),abs(R)-abs(L));f/=length(f)+1e-4;f*=uCurlK*C;f.y*=-1.;\n vec2 v=texture(uVelocity,vUv).xy+f*uDt;float d=dot(texture(uDye,vUv).rgb,vec3(.33));v.y+=d*uBuoy*uDt;\n o=vec4(clamp(v,-1000.,1000.),0.,1.);}',
pressure:HEAD+'uniform sampler2D uPressure,uDivergence;\nvoid main(){float L=texture(uPressure,vL).x,R=texture(uPressure,vR).x,T=texture(uPressure,vT).x,B=texture(uPressure,vB).x,d=texture(uDivergence,vUv).x;o=vec4((L+R+B+T-d)*.25,0.,0.,1.);}',
gradient:HEAD+'uniform sampler2D uPressure,uVelocity;\nvoid main(){float L=texture(uPressure,vL).x,R=texture(uPressure,vR).x,T=texture(uPressure,vT).x,B=texture(uPressure,vB).x;vec2 v=texture(uVelocity,vUv).xy-vec2(R-L,T-B);o=vec4(v,0.,1.);}',
scale:HEAD+'uniform sampler2D uTex;uniform float uV;\nvoid main(){o=uV*texture(uTex,vUv);}',
display:HEAD+'uniform sampler2D uDye;uniform vec2 uDyeTexel;uniform float uT;\n'+
 'float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}\n'+
 'void main(){vec3 c=texture(uDye,vUv).rgb;\n'+
 ' float l=dot(texture(uDye,vUv-vec2(uDyeTexel.x*3.,0.)).rgb,vec3(.33)),r=dot(texture(uDye,vUv+vec2(uDyeTexel.x*3.,0.)).rgb,vec3(.33));\n'+
 ' float b=dot(texture(uDye,vUv-vec2(0.,uDyeTexel.y*3.)).rgb,vec3(.33)),t=dot(texture(uDye,vUv+vec2(0.,uDyeTexel.y*3.)).rgb,vec3(.33));\n'+
 ' vec3 n=normalize(vec3(l-r,b-t,.22));float dif=clamp(dot(n,normalize(vec3(-.4,.6,.7))),0.,1.);\n'+
 ' vec3 sm=c*(.75+.45*dif);\n'+
 ' vec2 vv=vUv-.5;vec3 bg=mix(vec3(.030,.028,.036),vec3(.010,.010,.014),length(vv)*1.4);\n'+
 ' vec3 col=bg+(1.-exp(-sm*1.15))*.92;\n'+
 ' col*=1.-.35*dot(vv,vv);col+=(hash(gl_FragCoord.xy+fract(uT)*71.)-.5)*.018;o=vec4(col,1.);}'
};

function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s),src);throw new Error('shader');}return s;}
var vsObj;
function prog(fs){
  var p=gl.createProgram();gl.attachShader(p,vsObj);gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));
  gl.bindAttribLocation(p,0,'aPos');gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
  var u={},n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(var i=0;i<n;i++){var info=gl.getActiveUniform(p,i);u[info.name]=gl.getUniformLocation(p,info.name);}
  return {p:p,u:u};
}
var P={};
try{vsObj=sh(gl.VERTEX_SHADER,VS);for(var k in FS)P[k]=prog(FS[k]);}catch(e){window.__fail();return;}

var vbo=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

function target(w,h){
  var tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  var fb=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw new Error('fbo');
  gl.viewport(0,0,w,h);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
  return {tex:tex,fb:fb,w:w,h:h,tx:1/w,ty:1/h};
}
function dbl(w,h){var a=target(w,h),b=target(w,h);return {r:a,w:b,swap:function(){var t=this.r;this.r=this.w;this.w=t;}};}
function del(t){if(!t)return;gl.deleteTexture(t.tex);gl.deleteFramebuffer(t.fb);}

var W=1,H=1,vel,dye,div,crl,prs,simW,simH,dyeW,dyeH;
var small=Math.min(screen.width,screen.height)<700;
function resize(){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var w=Math.max(1,Math.round(canvas.clientWidth*dpr)),h=Math.max(1,Math.round(canvas.clientHeight*dpr));
  if(w===W&&h===H&&vel)return;
  W=w;H=h;canvas.width=w;canvas.height=h;
  var a=w/h,sr=small?96:144,dr=small?512:900;
  simH=a>=1?sr:Math.round(sr/a);simW=Math.round(simH*a);
  dyeH=a>=1?dr:Math.round(dr/a);dyeW=Math.round(dyeH*a);
  try{
    if(vel){del(vel.r);del(vel.w);del(dye.r);del(dye.w);del(div);del(crl);del(prs.r);del(prs.w);}
    vel=dbl(simW,simH);dye=dbl(dyeW,dyeH);div=target(simW,simH);crl=target(simW,simH);prs=dbl(simW,simH);
  }catch(e){window.__fail('This piece needs a browser that can render to floating-point textures. Try a current desktop Chrome, Edge, Firefox or Safari.');throw e;}
}
window.addEventListener('resize',resize);resize();

function run(p,out,texel){
  gl.useProgram(p.p);
  if(p.u.uTexel)gl.uniform2f(p.u.uTexel,texel[0],texel[1]);
  gl.bindFramebuffer(gl.FRAMEBUFFER,out?out.fb:null);
  gl.viewport(0,0,out?out.w:W,out?out.h:H);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
function bind(p,name,tex,unit){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(p.u[name],unit);}

function splat(x,y,fx,fy,color,radius){
  var p=P.splat;gl.useProgram(p.p);
  gl.uniform1f(p.u.uAspect,W/H);gl.uniform2f(p.u.uPoint,x,y);
  gl.uniform1f(p.u.uRadius,radius*.0008);gl.uniform3f(p.u.uColor,fx,fy,0);
  bind(p,'uTarget',vel.r.tex,0);run(p,vel.w,[vel.r.tx,vel.r.ty]);vel.swap();
  gl.useProgram(p.p);gl.uniform1f(p.u.uRadius,radius*.0011);gl.uniform3f(p.u.uColor,color[0],color[1],color[2]);
  bind(p,'uTarget',dye.r.tex,0);run(p,dye.w,[dye.r.tx,dye.r.ty]);dye.swap();
}

/* ---------- camera: movement only ---------- */
var video=null,stream=null,camOn=false,cw=96,ch=72,cvs=null,cctx=null,prevL=null,curD=null,prevD=null,texCur=null,texPrev=null,lastVT=-1,presence=0;
function camTex(){var t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t;}
function upload(t,data){gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);gl.texImage2D(gl.TEXTURE_2D,0,gl.R8,cw,ch,0,gl.RED,gl.UNSIGNED_BYTE,data);}
function startCam(){
  navigator.mediaDevices.getUserMedia({video:{width:{ideal:320},height:{ideal:240},facingMode:'user'},audio:false}).then(function(s){
    stream=s;video=document.createElement('video');video.muted=true;video.playsInline=true;video.setAttribute('playsinline','');video.srcObject=s;
    var pr=video.play();if(pr&&pr.catch)pr.catch(function(){});
    video.addEventListener('loadedmetadata',function(){
      var vw=video.videoWidth||320,vh=video.videoHeight||240;cw=96;ch=Math.max(8,Math.round(96*vh/vw));
      cvs=document.createElement('canvas');cvs.width=cw;cvs.height=ch;cctx=cvs.getContext('2d',{willReadFrequently:true});
      prevL=new Float32Array(cw*ch);curD=new Uint8Array(cw*ch);prevD=new Uint8Array(cw*ch);
      if(!texCur){texCur=camTex();texPrev=camTex();}
      upload(texCur,curD);upload(texPrev,prevD);
      camOn=true;camBtn.textContent='Camera on';statusEl.textContent='Camera sees movement only · nothing is recorded';
    });
  }).catch(function(){statusEl.textContent='Camera was blocked. Allow it in the browser settings and tap again';});
}
function stopCam(){
  if(stream)stream.getTracks().forEach(function(t){t.stop();});
  stream=null;video=null;camOn=false;camBtn.textContent='Use camera';statusEl.textContent='Move your pointer or finger through the smoke';
}
if(!window.__framed&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
  camBtn.hidden=false;
  camBtn.addEventListener('click',function(){if(camOn)stopCam();else startCam();});
}
function readCam(){
  if(!camOn||!video||video.readyState<2||video.currentTime===lastVT)return false;
  lastVT=video.currentTime;
  cctx.setTransform(-1,0,0,1,cw,0);cctx.drawImage(video,0,0,cw,ch);
  var px=cctx.getImageData(0,0,cw,ch).data,tmp=prevD;prevD=curD;curD=tmp;
  var sum=0;
  for(var y=0;y<ch;y++){
    var row=(ch-1-y)*cw;
    for(var x=0;x<cw;x++){
      var i=y*cw+x,j=i*4,l=px[j]*.299+px[j+1]*.587+px[j+2]*.114;
      var d=Math.abs(l-prevL[i]);prevL[i]=l;
      var v=Math.max(0,d-10)*4;if(v>255)v=255;
      curD[row+x]=v;sum+=v;
    }
  }
  presence+=(Math.min(1,sum/(cw*ch*20))-presence)*.1;
  upload(texPrev,prevD);upload(texCur,curD);
  return true;
}

/* ---------- pointer ---------- */
var ptr={x:.5,y:.5,dx:0,dy:0,moved:false,down:false};
function pos(ev){var r=canvas.getBoundingClientRect();return [(ev.clientX-r.left)/r.width,1-(ev.clientY-r.top)/r.height];}
canvas.addEventListener('pointerdown',function(ev){ptr.down=true;var p=pos(ev);ptr.x=p[0];ptr.y=p[1];});
canvas.addEventListener('pointermove',function(ev){
  if(ev.pointerType!=='mouse'&&!ptr.down)return;
  var p=pos(ev);ptr.dx+=p[0]-ptr.x;ptr.dy+=p[1]-ptr.y;ptr.x=p[0];ptr.y=p[1];ptr.moved=true;
});
function up(){ptr.down=false;}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);

/* ---------- colour of the smoke: pale, drifting slowly between warm, lilac and sea ---------- */
var TINTS=[[1,.92,.84],[.86,.82,1],[.78,.95,.95],[1,.86,.9]];
function tint(t,o){var u=(t*.02+o)%TINTS.length,i=Math.floor(u),f=u-i,a=TINTS[i],b=TINTS[(i+1)%TINTS.length];return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f];}

/* ---------- loop ---------- */
var calm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var clock=Math.random()*300,last=performance.now();
gl.disable(gl.BLEND);
function frame(now){
  requestAnimationFrame(frame);
  resize();
  var dt=Math.min(.033,(now-last)/1000);last=now;clock+=dt;
  if(calm)dt*=.5;
  var sx=[vel.r.tx,vel.r.ty];

  /* ambient drafts: a few slow sources so the room is never still; they give way when someone is present */
  var amb=(1-Math.min(1,presence*3))*(ptr.moved?.4:1);
  for(var e=0;e<3;e++){
    var tt=clock*(.07+e*.023)+e*2.1;
    var ex=.5+.38*Math.sin(tt*1.3+e),ey=.12+.1*Math.sin(tt*.9+e*1.7)+e*.05;
    if(Math.random()<.5*amb){
      var c=tint(clock,e*1.3),g=.010*amb;
      splat(ex,ey,Math.sin(tt*2.)*60*amb,(120+60*Math.sin(tt))*amb,[c[0]*g*5,c[1]*g*5,c[2]*g*5],.9);
    }
  }
  /* pointer */
  if(ptr.moved){
    var pc=tint(clock,.5);
    splat(ptr.x,ptr.y,ptr.dx*7000,ptr.dy*7000,[pc[0]*.22,pc[1]*.22,pc[2]*.22],1.2);
    ptr.dx=0;ptr.dy=0;ptr.moved=false;
  }
  /* camera movement */
  var fresh=readCam();
  if(camOn&&texCur){
    var va=cw/ch,sa=W/H,scale=va>sa?[sa/va,1]:[1,va/sa];
    var p=P.motion;gl.useProgram(p.p);
    gl.uniform2f(p.u.uCamTexel,1/cw,1/ch);gl.uniform2f(p.u.uCamScale,scale[0],scale[1]);
    bind(p,'uCur',texCur,1);bind(p,'uPrev',texPrev,2);
    if(fresh){
      gl.uniform1f(p.u.uMode,0);gl.uniform1f(p.u.uK,1400);bind(p,'uTarget',vel.r.tex,0);run(p,vel.w,sx);vel.swap();
    }
    gl.useProgram(p.p);
    var mc=tint(clock,0);gl.uniform1f(p.u.uMode,1);gl.uniform1f(p.u.uK,dt*1.1);gl.uniform3f(p.u.uColor,mc[0],mc[1],mc[2]);
    bind(p,'uTarget',dye.r.tex,0);run(p,dye.w,[dye.r.tx,dye.r.ty]);dye.swap();
  }

  /* fluid step */
  var q;
  q=P.curl;gl.useProgram(q.p);bind(q,'uVelocity',vel.r.tex,0);run(q,crl,sx);
  q=P.vorticity;gl.useProgram(q.p);bind(q,'uVelocity',vel.r.tex,0);bind(q,'uCurl',crl.tex,1);bind(q,'uDye',dye.r.tex,2);
  gl.uniform1f(q.u.uCurlK,22);gl.uniform1f(q.u.uDt,dt);gl.uniform1f(q.u.uBuoy,40);run(q,vel.w,sx);vel.swap();
  q=P.divergence;gl.useProgram(q.p);bind(q,'uVelocity',vel.r.tex,0);run(q,div,sx);
  q=P.scale;gl.useProgram(q.p);bind(q,'uTex',prs.r.tex,0);gl.uniform1f(q.u.uV,.8);run(q,prs.w,sx);prs.swap();
  q=P.pressure;gl.useProgram(q.p);
  for(var it=0;it<20;it++){bind(q,'uPressure',prs.r.tex,0);bind(q,'uDivergence',div.tex,1);run(q,prs.w,sx);prs.swap();}
  q=P.gradient;gl.useProgram(q.p);bind(q,'uPressure',prs.r.tex,0);bind(q,'uVelocity',vel.r.tex,1);run(q,vel.w,sx);vel.swap();
  q=P.advect;gl.useProgram(q.p);gl.uniform2f(q.u.uVelTexel,sx[0],sx[1]);gl.uniform1f(q.u.uDt,dt);
  gl.uniform1f(q.u.uDiss,.25);bind(q,'uVelocity',vel.r.tex,0);bind(q,'uSource',vel.r.tex,1);run(q,vel.w,sx);vel.swap();
  gl.useProgram(q.p);gl.uniform1f(q.u.uDiss,.55);bind(q,'uVelocity',vel.r.tex,0);bind(q,'uSource',dye.r.tex,1);run(q,dye.w,[dye.r.tx,dye.r.ty]);dye.swap();

  q=P.display;gl.useProgram(q.p);bind(q,'uDye',dye.r.tex,0);gl.uniform2f(q.u.uDyeTexel,dye.r.tx,dye.r.ty);gl.uniform1f(q.u.uT,clock);
  run(q,null,[1/W,1/H]);
}
requestAnimationFrame(frame);
})();
