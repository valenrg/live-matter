<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presence</title>
<meta name="description" content="The air over one place on Earth, right now, as a room of smoke you can step into. The camera sees movement only; nothing is recorded.">
<meta name="theme-color" content="#060608">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: full-screen canvas, museum placard bottom-left, quiet controls bottom-right. Single dark world by choice. */
  --wall:#060608;
  --ink:#ecebf2;
  --ink-dim:#8d8b9c;
  --line:rgba(236,235,242,.18);
  --glass:rgba(14,14,20,.55);
  --accent:#e9dcff;
  --font-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --font-body:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--wall);color:var(--ink);overflow:hidden}
body{font-family:var(--font-body);font-size:12px;line-height:1.4}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.ui{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;padding:16px;pointer-events:none;transition:opacity .8s ease}
.ui.idle{opacity:0}
.placard{pointer-events:none;max-width:62ch;display:flex;flex-direction:column;gap:5px}
.placard h1{font-family:var(--font-display);font-style:italic;font-weight:400;font-size:26px;line-height:1;margin:0 0 2px;letter-spacing:.01em}
.placard p{margin:0;color:var(--ink-dim);letter-spacing:.04em;text-transform:uppercase;font-size:10px;font-variant-numeric:tabular-nums}
.placard p.read{color:var(--ink);text-transform:none;letter-spacing:.02em;font-size:11px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:auto}
.btn{font:inherit;font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:10px;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[hidden]{display:none}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.fallback{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;background:radial-gradient(circle at 50% 30%,#2a2833,#060608 70%)}
.fallback p{max-width:40ch;background:var(--glass);padding:14px 18px;border-radius:12px;border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.ui{transition:none}}
.meta{display:flex;align-items:center;gap:8px}.dot{width:6px;height:6px;border-radius:50%;background:var(--ink-dim);flex:none}.dot.live{background:#9fe0c8}.placard p.tick{margin-top:4px;text-transform:none;letter-spacing:.02em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(70ch,calc(100vw - 32px))}
</style>
</head>
<body>
<canvas id="c" aria-label="Generative artwork: a room of slow smoke lit from above, moved by the live wind and temperature profile over a place on Earth, and stirred by the visitor's movement"></canvas>
<div class="fallback" id="fallback"><p id="fallbackText">This piece needs WebGL 2, which this browser did not provide. Open it in a current version of Safari, Chrome or Firefox.</p></div>

<div class="ui" id="ui">
  <div class="placard">
    <h1>Presence</h1>
    <p class="meta"><span class="dot" id="dot"></span><span><span id="place">Air</span> &middot; <span id="status">Connecting to Open-Meteo</span></span></p>
    <p class="tick" id="read">&nbsp;</p>
    <p>Wind and temperature from the ground to 180 m &middot; drag through the smoke &middot; weather data Open-Meteo.com</p>
  </div>
  <div class="controls">
    <a class="btn back" href="../">&larr; Live Matter</a>
    <button class="btn" id="camBtn" type="button" hidden>Use camera</button>
    <button class="btn" id="fsBtn" type="button" hidden>Full screen</button>
  </div>
</div>

<script>
(function(){
'use strict';
/* Shared: full screen where the browser offers it, controls that fade when untouched. */
var fsBtn=document.getElementById('fsBtn'),root=document.documentElement;
if(root.requestFullscreen&&document.fullscreenEnabled){
  fsBtn.hidden=false;
  fsBtn.addEventListener('click',function(){
    try{var pr=document.fullscreenElement?document.exitFullscreen():root.requestFullscreen();if(pr&&pr.catch)pr.catch(function(){});}catch(e){}
  });
  document.addEventListener('fullscreenchange',function(){fsBtn.textContent=document.fullscreenElement?'Exit full screen':'Full screen';});
}
var ui=document.getElementById('ui'),idleTimer=null;
function wake(){ui.classList.remove('idle');clearTimeout(idleTimer);idleTimer=setTimeout(function(){if(!ui.matches(':focus-within'))ui.classList.add('idle');},6000);}
window.__wake=wake;
document.addEventListener('keydown',wake);document.addEventListener('pointermove',wake);document.addEventListener('pointerdown',wake);wake();
window.__fail=function(msg){if(msg)document.getElementById('fallbackText').textContent=msg;document.getElementById('fallback').style.display='grid';};
window.__framed=(function(){try{return window.self!==window.top;}catch(e){return true;}})();
})();
</script>
<script>
(function(){
'use strict';
/* Presence: the air over one place on Earth, right now, as a room of smoke that you can step into.
   Data: Open-Meteo (free, no key; CC BY 4.0), hourly model values for a dozen places, refreshed every 30 minutes:
   wind speed and direction at 10, 80, 120 and 180 m above the ground, temperature at 2, 80, 120 and 180 m,
   gusts, cloud cover, daylight and sunshine. Every few minutes the room moves to another place.
   Physics kept, look abstracted, in true 3D:
   - the room is the lowest 180 m of the atmosphere (the boundary layer), filled with smoke from slow sources
     on the ground; we ride along with the air, so what we see is the wind's shear: layers sliding past one
     another and turning with height, as the real profile does at that place right now;
   - the temperature profile sets the air's stability: in stable air (night, inversions) rising smoke stops at
     its own level and spreads into flat sheets that ripple with buoyancy waves; in unstable air (sunny ground)
     warm thermals break away from the floor and climb through the whole room;
   - gusts set the turbulence; day or night and cloud cover set the light;
   - with the camera on, the piece sees movement and nothing else (a tiny grid of brightness changes, thrown away
     each frame): where you move, warm air is released into the room near you and rises through the smoke.
     Without a camera, drag through the smoke. */
var canvas=document.getElementById('c');
var gl=canvas.getContext('webgl2',{antialias:false,alpha:false,depth:false,stencil:false,powerPreference:'high-performance'});
if(!gl){window.__fail();return;}
if(!gl.getExtension('EXT_color_buffer_float')){window.__fail('This piece needs floating-point rendering, which this browser or device does not offer. Try a desktop browser.');return;}
gl.getExtension('OES_texture_float_linear');
var statusEl=document.getElementById('status'),readEl=document.getElementById('read'),placeEl=document.getElementById('place'),dotEl=document.getElementById('dot'),camBtn=document.getElementById('camBtn');
var Q=new URLSearchParams(location.search);
var low=Q.get('q')==='low'||Math.min(screen.width,screen.height)<700;
var NX=low?64:96,NY=low?48:64,NZ=NX,TC=8,VX=NX/2,VY=NY/2,VZ=NZ/2;
var L=4,H=L*NY/NX,HD=L/NX,HV=L/VX;
var RS=low?.42:.55,RSMAX=low?.55:.85,ceilRS=1,fps=60,qt=0;
function f(x){return x.toFixed(5);}

/* ---------- shaders ---------- */
var VS='#version 300 es\nin vec2 aPos;void main(){gl_Position=vec4(aPos,0.,1.);}';
var HEAD='#version 300 es\nprecision highp float;precision highp int;precision highp sampler2D;precision highp sampler3D;\nout vec4 o;\n';
/* a 3D grid stored as a 2D atlas: one tile per horizontal slice; wraps sideways (the room repeats forever), clamps vertically */
function grid(nm,nx,ny,nz){return [
 'ivec2 A'+nm+'(ivec3 v){return ivec2((v.y%'+TC+')*'+nx+'+v.x,(v.y/'+TC+')*'+nz+'+v.z);}',
 'ivec3 V'+nm+'(ivec2 q){int tx=q.x/'+nx+',ty=q.y/'+nz+';return ivec3(q.x-tx*'+nx+',ty*'+TC+'+tx,q.y-ty*'+nz+');}',
 'vec4 F'+nm+'(sampler2D s,ivec3 v){v.x=((v.x%'+nx+')+'+nx+')%'+nx+';v.z=((v.z%'+nz+')+'+nz+')%'+nz+';v.y=clamp(v.y,0,'+(ny-1)+');return texelFetch(s,A'+nm+'(v),0);}',
 'vec4 T'+nm+'(sampler2D s,vec3 p){p-=.5;vec3 fl=floor(p);ivec3 i=ivec3(fl);vec3 w=p-fl;',
 ' vec4 a=mix(F'+nm+'(s,i),F'+nm+'(s,i+ivec3(1,0,0)),w.x),b=mix(F'+nm+'(s,i+ivec3(0,1,0)),F'+nm+'(s,i+ivec3(1,1,0)),w.x);',
 ' vec4 c=mix(F'+nm+'(s,i+ivec3(0,0,1)),F'+nm+'(s,i+ivec3(1,0,1)),w.x),d=mix(F'+nm+'(s,i+ivec3(0,1,1)),F'+nm+'(s,i+ivec3(1,1,1)),w.x);',
 ' return mix(mix(a,b,w.y),mix(c,d,w.y),w.z);}'].join('\n')+'\n';}
var GD=grid('D',NX,NY,NZ),GV=grid('V',VX,VY,VZ);
var CONST='const float L='+f(L)+',H='+f(H)+',HD='+f(HD)+',HV='+f(HV)+';\n';
/* everything that adds air or smoke: sources on the ground, thermals, your hand; and what the camera saw */
var SRC='uniform vec4 uS[16],uS2[16],uS3[16];uniform int uSN;\n'+
 'uniform sampler2D uMot,uMotP;uniform float uCamOn,uDI;uniform vec3 uEye;uniform mat3 uRot;uniform float uTanH,uAsp;\n'+
 'vec3 wrapd(vec3 r){r.xz-=L*floor(r.xz/L+.5);return r;}\n'+
 /* project a point of the room into the visitor's camera view: movement seen there is released at a depth near you */
 'vec4 seen(vec3 X){if(uCamOn<.5)return vec4(0.);vec3 d=wrapd(X-uEye);vec3 v=transpose(uRot)*d;float z=-v.z;'+
 ' float band=exp(-pow((z-uDI)/.55,2.));if(band<.02||z<.15)return vec4(0.);'+
 ' vec2 s=vec2(v.x/(z*uTanH*uAsp),v.y/(z*uTanH));if(abs(s.x)>1.||abs(s.y)>1.)return vec4(0.);vec2 uv=s*.5+.5;'+
 ' float m=texture(uMot,uv).r;vec2 e=1./vec2(textureSize(uMot,0))*1.5;'+
 ' vec2 g=vec2(texture(uMot,uv+vec2(e.x,0.)).r-texture(uMotP,uv+vec2(e.x,0.)).r-texture(uMot,uv-vec2(e.x,0.)).r+texture(uMotP,uv-vec2(e.x,0.)).r,'+
 '  texture(uMot,uv+vec2(0.,e.y)).r-texture(uMotP,uv+vec2(0.,e.y)).r-texture(uMot,uv-vec2(0.,e.y)).r+texture(uMotP,uv-vec2(0.,e.y)).r);'+
 ' return vec4(m*band,g*band,0.);}\n';

var FS={};
FS.vadv=HEAD+CONST+GV+'uniform sampler2D uV;uniform float uDt;\n'+
 'void main(){ivec3 v=VV(ivec2(gl_FragCoord.xy));vec3 u=FV(uV,v).xyz;o=vec4(TV(uV,vec3(v)+.5-uDt*u/HV).xyz*.998,0.);}';
FS.curl=HEAD+CONST+GV+'uniform sampler2D uV;\n'+
 'void main(){ivec3 v=VV(ivec2(gl_FragCoord.xy));ivec3 X=ivec3(1,0,0),Y=ivec3(0,1,0),Z=ivec3(0,0,1);'+
 ' vec3 c=vec3(FV(uV,v+Y).z-FV(uV,v-Y).z-FV(uV,v+Z).y+FV(uV,v-Z).y,FV(uV,v+Z).x-FV(uV,v-Z).x-FV(uV,v+X).z+FV(uV,v-X).z,FV(uV,v+X).y-FV(uV,v-X).y-FV(uV,v+Y).x+FV(uV,v-Y).x)*.5/HV;'+
 ' o=vec4(c,length(c));}';
FS.vforce=HEAD+CONST+GV+GD+SRC+'uniform sampler2D uV,uC,uD;uniform float uDt,uT,uTurb,uConf,uRelax;uniform vec4 uProf[5];\n'+
 'vec2 prof(float y){float m=y/H*180.;vec2 r=uProf[4].yz;for(int i=0;i<4;i++){if(m<uProf[i+1].x){r=mix(uProf[i].yz,uProf[i+1].yz,clamp((m-uProf[i].x)/(uProf[i+1].x-uProf[i].x),0.,1.));break;}}return r;}\n'+
 'void main(){ivec3 v=VV(ivec2(gl_FragCoord.xy));vec3 X=(vec3(v)+.5)*HV;vec3 u=FV(uV,v).xyz;'+
 /* buoyancy from the smoke grid's warmth */
 ' vec4 d=TD(uD,X/HD);u.y+=uDt*d.g;'+
 /* the wind profile of the place, as seen riding with the air */
 ' u.xz+=(prof(X.y)-u.xz)*min(uRelax*uDt,1.);'+
 /* vortices kept alive (vorticity confinement) */
 ' ivec3 IX=ivec3(1,0,0),IY=ivec3(0,1,0),IZ=ivec3(0,0,1);vec3 gw=vec3(FV(uC,v+IX).w-FV(uC,v-IX).w,FV(uC,v+IY).w-FV(uC,v-IY).w,FV(uC,v+IZ).w-FV(uC,v-IZ).w);'+
 ' u+=uDt*uConf*HV*cross(gw/(length(gw)+1e-5),FV(uC,v).xyz);'+
 /* gusts: a slowly changing turbulent push, stronger near the rough ground */
 ' vec3 q=X*vec3(1.6,1.9,1.6);float tt=uT*.35;'+
 ' vec3 tf=vec3(sin(q.y*2.1+tt*1.3+2.*sin(q.z*1.3-tt)),sin(q.z*1.9-tt+2.*sin(q.x*1.7+tt*.7)),sin(q.x*2.3+tt*1.1+2.*sin(q.y*1.1-tt*.8)));'+
 ' u+=uDt*uTurb*tf*(.45+.8*exp(-X.y*1.4));'+
 ' for(int k=0;k<16;k++){if(k>=uSN)break;vec3 r=wrapd(X-uS[k].xyz);float g=exp(-dot(r,r)/(uS[k].w*uS[k].w));u+=uDt*g*uS3[k].xyz;}'+
 ' vec4 m=seen(X);u.y+=uDt*m.x*3.5;u+=uDt*(uRot*vec3(m.y,m.z,0.))*22.;u+=uDt*m.x*wrapd(X-uEye)*1.2;'+
 ' if(v.y==0)u.y=max(u.y,0.);'+
 ' float sp=length(u);if(sp>3.)u*=3./sp;'+
 ' o=vec4(u,0.);}';
FS.div=HEAD+CONST+GV+'uniform sampler2D uV;\n'+
 'void main(){ivec3 v=VV(ivec2(gl_FragCoord.xy));ivec3 X=ivec3(1,0,0),Y=ivec3(0,1,0),Z=ivec3(0,0,1);'+
 ' float B=v.y==0?-FV(uV,v).y:FV(uV,v-Y).y;'+
 ' o=vec4(.5*(FV(uV,v+X).x-FV(uV,v-X).x+FV(uV,v+Y).y-B+FV(uV,v+Z).z-FV(uV,v-Z).z),0.,0.,0.);}';
FS.jac=HEAD+CONST+GV+'uniform sampler2D uP,uDv;\n'+
 'void main(){ivec3 v=VV(ivec2(gl_FragCoord.xy));ivec3 X=ivec3(1,0,0),Y=ivec3(0,1,0),Z=ivec3(0,0,1);float c=FV(uP,v).x;'+
 ' float B=v.y==0?c:FV(uP,v-Y).x,T=v.y=='+(VY-1)+'?0.:FV(uP,v+Y).x;'+
 ' o=vec4((FV(uP,v+X).x+FV(uP,v-X).x+FV(uP,v+Z).x+FV(uP,v-Z).x+B+T-FV(uDv,v).x)/6.,0.,0.,0.);}';
FS.grad=HEAD+CONST+GV+'uniform sampler2D uP,uV;\n'+
 'void main(){ivec3 v=VV(ivec2(gl_FragCoord.xy));ivec3 X=ivec3(1,0,0),Y=ivec3(0,1,0),Z=ivec3(0,0,1);float c=FV(uP,v).x;'+
 ' float B=v.y==0?c:FV(uP,v-Y).x,T=v.y=='+(VY-1)+'?0.:FV(uP,v+Y).x;'+
 ' vec3 u=FV(uV,v).xyz-.5*vec3(FV(uP,v+X).x-FV(uP,v-X).x,T-B,FV(uP,v+Z).x-FV(uP,v-Z).x);if(v.y==0)u.y=max(u.y,0.);o=vec4(u,0.);}';
/* the smoke: density (r), buoyancy (g), how much of it came from you (b) */
FS.dens=HEAD+CONST+GD+GV+SRC+'uniform sampler2D uD,uV;uniform float uDt,uN2,uDecay,uInit,uT;\n'+
 'float hs(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}\n'+
 'void main(){ivec3 v=VD(ivec2(gl_FragCoord.xy));vec3 p=vec3(v)+.5;vec3 X=p*HD;'+
 ' vec3 u=TV(uV,X/HV).xyz;vec4 d=TD(uD,p-uDt*u/HD);'+
 ' d.r*=exp(-uDt*uDecay)*(1.-uDt*.6*smoothstep(H*.82,H,X.y));'+
 ' d.g+=-uDt*uN2*u.y-uDt*d.g/7.;d.g=clamp(d.g,-2.,2.5);d.b*=exp(-uDt*.04);'+
 ' for(int k=0;k<16;k++){if(k>=uSN)break;vec3 r=wrapd(X-uS[k].xyz);float g=exp(-dot(r,r)/(uS[k].w*uS[k].w));'+
 '  float add=uDt*g*uS2[k].x;d.b=(d.b*d.r+add*uS2[k].z)/max(d.r+add,1e-4);d.r+=add;d.g+=uDt*g*uS2[k].y;}'+
 ' vec4 m=seen(X);if(m.x>0.){float add=uDt*m.x*5.;d.b=(d.b*d.r+add)/max(d.r+add,1e-4);d.r+=add;d.g+=uDt*m.x*4.;}'+
 ' if(uInit>0.){vec3 w=X*vec3(1.7,2.6,1.7);float n=.5+.25*sin(w.x+sin(w.z*1.3))+.25*sin(w.z*1.1+sin(w.y*2.+w.x));'+
 '  float lay=exp(-pow((X.y-H*.35)/(H*.08),2.))+.6*exp(-pow((X.y-H*.62)/(H*.06),2.));d=vec4(.5*smoothstep(.45,.95,n)*lay,0.,0.,0.);}'+
 ' o=max(d,vec4(0.,-2.,0.,0.));}';
/* copy one slice of the atlas into a real 3D texture, so the renderer gets hardware filtering and wrapping */
FS.copy=HEAD+CONST+GD+'uniform sampler2D uD;uniform int uLayer;\n'+
 'void main(){o=FD(uD,ivec3(int(gl_FragCoord.x),uLayer,int(gl_FragCoord.y)));}';
/* light: how much of the key light reaches each point through the smoke above it (self-shadowing) */
FS.light=HEAD+CONST+'uniform sampler3D uVol;uniform vec3 uLd;uniform int uLayer;uniform float uSig;\n'+
 'void main(){vec3 p=vec3(gl_FragCoord.x*HD,(float(uLayer)+.5)*'+f(H/NY)+',gl_FragCoord.y*HD);float s=0.,st=HD*1.3;'+
 ' for(int i=0;i<40;i++){p+=uLd*st;if(p.y>H)break;s+=texture(uVol,vec3(p.x/L,p.z/L,p.y/H)).r*st;st*=1.07;}'+
 ' o=vec4(exp(-s*uSig*.85),0.,0.,1.);}';
FS.render=HEAD+CONST+'uniform sampler3D uVol,uLit,uNz;uniform vec3 uEye,uLd,uLc,uAmb,uFog;uniform mat3 uRot;uniform float uTanH,uAsp,uT,uSig,uHaze;uniform vec2 uRes;\n'+
 'float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}\n'+
 'void main(){vec2 uv=gl_FragCoord.xy/uRes*2.-1.;vec3 rd=normalize(uRot*vec3(uv.x*uTanH*uAsp,uv.y*uTanH,-1.));'+
 ' float cosA=dot(rd,uLd);float g=.7,hg=(1.-g*g)/pow(1.+g*g-2.*g*cosA,1.5);float ph=.18+hg*.22;'+
 ' float tF=rd.y<-1e-4?-uEye.y/rd.y:1e9,tTop=rd.y>1e-4?(H-uEye.y)/rd.y:1e9,tMax=12.;float tE=min(min(tF,tTop),tMax);'+
 ' float t=.03*hash(gl_FragCoord.xy+fract(uT*7.13)*91.7)+.01;vec3 col=vec3(0.);float Tr=1.;'+
 ' for(int i=0;i<140;i++){if(t>tE||Tr<.008)break;float dt=min(.022+t*.028,tE-t+1e-3);vec3 p=uEye+rd*(t+dt*.5);'+
 '  vec3 tc=vec3(p.x/L,p.z/L,p.y/H);vec4 s=texture(uVol,tc);float lit=texture(uLit,tc).r;'+
 '  vec3 nq=p*vec3(.9,1.3,.9)+vec3(uT*.011,-uT*.017,uT*.007);float dn=texture(uNz,nq).r*.55+texture(uNz,nq*2.9+.37).r*.30+texture(uNz,nq*7.3+.71).r*.15;'+
 '  vec2 pq=p.xz*.071;float pch=texture(uNz,vec3(pq,.13)).r*.6+texture(uNz,vec3(pq*2.37+.5,.61)).r*.4;'+
 '  float sd=max(s.r-.025,0.)*smoothstep(.2,.6,dn+s.r*1.5)*2.*smoothstep(.22,.62,pch)*smoothstep(H*.98,H*.55,p.y);'+
 '  vec2 dh=abs(p.xz-uEye.xz);float home=smoothstep(L*.5,L*.36,max(dh.x,dh.y));float mine=clamp(s.b,0.,1.)*(1.-home);sd*=1.-mine;s.b*=home;'+
 '  float de=sd*uSig+uHaze;vec3 alb=mix(vec3(.88,.88,.93),vec3(1.,.62,.46),clamp(s.b,0.,1.));'+
 '  vec3 Li=uLc*lit*ph+uAmb*(.55+.45*clamp(p.y/H,0.,1.));float fg=exp(-max(t-2.5,0.)*.28);float a=1.-exp(-de*dt);col+=Tr*a*mix(uFog*2.,alb*Li+vec3(1.,.45,.3)*.22*clamp(s.b,0.,1.)*sd*4.,fg);Tr*=1.-a;t+=dt;}'+
 ' vec3 bg;'+
 ' if(tE==tF){vec3 P=uEye+rd*tF;float lit=texture(uLit,vec3(P.x/L,P.z/L,.5/'+NY+'.)).r;'+      /* the ground: matte, lit through the smoke */
 '  bg=vec3(.010,.010,.013)+uLc*lit*max(uLd.y,0.)*.035+uAmb*.2;bg=mix(uFog,bg,exp(-tF*.09));}'+
 ' else bg=uFog*(1.-.5*smoothstep(0.,.6,rd.y));'+
 ' bg+=uLc*(pow(max(cosA,0.),300.)*1.5+pow(max(cosA,0.),12.)*.10)*smoothstep(-.03,.15,rd.y);'+

function setSrc(p,sn){gl.uniform4fv(p.u.uS,US);gl.uniform4fv(p.u.uS2,US2);gl.uniform4fv(p.u.uS3,US3);gl.uniform1i(p.u.uSN,sn);
  gl.uniform3f(p.u.uEye,cam.eye[0],cam.eye[1],cam.eye[2]);gl.uniformMatrix3fv(p.u.uRot,false,cam.rot);gl.uniform1f(p.u.uTanH,TANH);gl.uniform1f(p.u.uAsp,CW/CH);
  gl.uniform1f(p.u.uCamOn,camOn?1:0);gl.uniform1f(p.u.uDI,1.5-.6*Math.min(1,presence*2.5));
  bind(p,'uMot',texCur,6);bind(p,'uMotP',texPrev,7);}
function frame(now){
  requestAnimationFrame(frame);resize();
  var rdt=Math.min(.05,(now-last)/1000);last=now;fpsA+=(1/Math.max(rdt,1e-3)-fpsA)*.05;
  var dt=Math.min(.033,rdt)*(calm?.5:1);clock+=dt;simT+=dt;
  /* adaptive render scale, with hysteresis; only the internal target changes, never the canvas */
  qt+=rdt;if(qt>3&&fpsA<40&&RS>.32){RS=Math.max(.32,RS-.05);ceilRS=RS;qt=0;setTarget();}
  else if(qt>10&&fpsA>57&&RS<Math.min(RSMAX,ceilRS+.1)-.001){RS=Math.min(RSMAX,RS+.05);qt=0;setTarget();}
  /* which place */
  if(simT-placeT0>PLACE_DUR||!Tgt){if(Tgt){placeI=(placeI+1)%PLACES.length;}placeT0=simT;}
  if(simT-lastCap>5){obs=current();Tgt=target(obs);caption(obs,Tgt);lastCap=simT;}
  ease(dt);readCam();camera(clock);
  var sn=sources(dt);
  for(var i=0;i<5;i++)PR.set([S.prof[i][0],S.prof[i][1],S.prof[i][2],0],i*4);
  gl.disable(gl.BLEND);
  /* velocity */
  var p=use(P.vadv);bind(p,'uV',vel.r.t,0);gl.uniform1f(p.u.uDt,dt);to(vel.w,AVW,AVH);draw();vel.swap();
  p=use(P.curl);bind(p,'uV',vel.r.t,0);to(curlT,AVW,AVH);draw();
  p=use(P.vforce);bind(p,'uV',vel.r.t,0);bind(p,'uC',curlT.t,1);bind(p,'uD',dens.r.t,2);setSrc(p,sn);
  gl.uniform1f(p.u.uDt,dt);gl.uniform1f(p.u.uT,simT);gl.uniform1f(p.u.uTurb,S.turb);gl.uniform1f(p.u.uConf,1.1);gl.uniform1f(p.u.uRelax,.35);gl.uniform4fv(p.u.uProf,PR);
  to(vel.w,AVW,AVH);draw();vel.swap();
  p=use(P.div);bind(p,'uV',vel.r.t,0);to(divT,AVW,AVH);draw();
  p=use(P.jac);bind(p,'uDv',divT.t,1);for(var j=0;j<20;j++){bind(p,'uP',prs.r.t,0);to(prs.w,AVW,AVH);draw();prs.swap();}
  p=use(P.grad);bind(p,'uP',prs.r.t,0);bind(p,'uV',vel.r.t,1);to(vel.w,AVW,AVH);draw();vel.swap();
  /* smoke */
  p=use(P.dens);bind(p,'uD',dens.r.t,0);bind(p,'uV',vel.r.t,1);setSrc(p,sn);
  gl.uniform1f(p.u.uDt,dt);gl.uniform1f(p.u.uN2,S.N2);gl.uniform1f(p.u.uDecay,.11);gl.uniform1f(p.u.uInit,first?1:0);gl.uniform1f(p.u.uT,simT);
  to(dens.w,ADW,ADH);draw();dens.swap();first=false;
  /* to 3D, then light */
  p=use(P.copy);bind(p,'uD',dens.r.t,0);for(var y=0;y<NY;y++){layer(vol,y,NX,NZ);gl.uniform1i(p.u.uLayer,y);draw();}
  var day=S.day,el=lerp(.30,.52,day),az=-2.2+.25*Math.sin(simT*.01);
  var Ld=norm([Math.cos(az)*Math.sqrt(1-el*el),el,Math.sin(az)*Math.sqrt(1-el*el)]);
  var key=(1-.6*S.cloud),Lc=[lerp(1.3,3.6,day)*key,lerp(1.55,2.85,day)*key,lerp(2.4,2.0,day)*key];
  var amb=[lerp(.010,.020,day)*(1+S.cloud),lerp(.011,.020,day)*(1+S.cloud),lerp(.028,.042,day)*(1+S.cloud)];
  var SIG=7.*(Number(Q.get('sig'))||1);
  p=use(P.light);bind(p,'uVol',vol.t,0,true);gl.uniform3f(p.u.uLd,Ld[0],Ld[1],Ld[2]);gl.uniform1f(p.u.uSig,SIG);
  for(y=0;y<NY;y++){layer(lit,y,NX,NZ);gl.uniform1i(p.u.uLayer,y);draw();}
  /* render */
  p=use(P.render);bind(p,'uVol',vol.t,0,true);bind(p,'uLit',lit.t,1,true);bind(p,'uNz',noiseT,2,true);
  gl.uniform3f(p.u.uEye,cam.eye[0],cam.eye[1],cam.eye[2]);gl.uniformMatrix3fv(p.u.uRot,false,cam.rot);gl.uniform1f(p.u.uTanH,TANH);gl.uniform1f(p.u.uAsp,CW/CH);
  gl.uniform3f(p.u.uLd,Ld[0],Ld[1],Ld[2]);gl.uniform3f(p.u.uLc,Lc[0],Lc[1],Lc[2]);gl.uniform3f(p.u.uAmb,amb[0],amb[1],amb[2]);
  gl.uniform3f(p.u.uFog,amb[0]*.5+Lc[0]*.005,amb[1]*.5+Lc[1]*.005,amb[2]*.5+Lc[2]*.005);
  gl.uniform1f(p.u.uT,clock);gl.uniform1f(p.u.uSig,SIG);gl.uniform1f(p.u.uHaze,.006+.012*S.cloud);gl.uniform2f(p.u.uRes,RW,RH);
  to(hdr,RW,RH);draw();

  p=use(P.acc);bind(p,'uCur',hdr.t,0);bind(p,'uPrev',acc.r.t,1);gl.uniform1f(p.u.uK,accN<1?1:.4);gl.uniform2f(p.u.uRes,RW,RH);to(acc.w,RW,RH);draw();acc.swap();accN++;
  gl.bindTexture(gl.TEXTURE_2D,acc.r.t);gl.generateMipmap(gl.TEXTURE_2D);
  p=use(P.disp);bind(p,'uAcc',acc.r.t,0);gl.uniform2f(p.u.uRes,CW,CH);gl.uniform1f(p.u.uT,clock);to(null,CW,CH);draw();
}
window.__time=function(){return simT;};
window.__stats=function(){function rd(t,w,h){gl.bindFramebuffer(gl.FRAMEBUFFER,t.fb);var b=new Float32Array(w*h*4);gl.readPixels(0,0,w,h,gl.RGBA,gl.FLOAT,b);
  var mx=[-1e9,-1e9,-1e9,-1e9],mn=[1e9,1e9,1e9,1e9],sm=[0,0,0,0],nan=0;for(var i=0;i<b.length;i+=4)for(var c=0;c<4;c++){var v=b[i+c];if(v!==v){nan++;continue;}mx[c]=Math.max(mx[c],v);mn[c]=Math.min(mn[c],v);sm[c]+=v;}
  return {max:mx.map(function(x){return +x.toFixed(3);}),min:mn.map(function(x){return +x.toFixed(3);}),mean:sm.map(function(x){return +(x/(w*h)).toFixed(4);}),nan:nan};}
  layer(vol,Math.floor(NY/4),NX,NZ);var vb=new Float32Array(NX*NZ*4);gl.readPixels(0,0,NX,NZ,gl.RGBA,gl.FLOAT,vb);var vm=0;for(var i=0;i<vb.length;i+=4)vm=Math.max(vm,vb[i]);
  layer(lit,Math.floor(NY/4),NX,NZ);var lb=new Float32Array(NX*NZ*4);gl.readPixels(0,0,NX,NZ,gl.RGBA,gl.FLOAT,lb);var lm=[9,0];for(i=0;i<lb.length;i+=4){lm[0]=Math.min(lm[0],lb[i]);lm[1]=Math.max(lm[1],lb[i]);}
  return {volmax:vm,lit:lm,dens:rd(dens.r,ADW,ADH),vel:rd(vel.r,AVW,AVH),S:{N2:S.N2,inst:S.inst,turb:S.turb,day:S.day},RS:RS};};
window.__place=function(i){placeI=i;placeT0=simT;lastCap=-99;};
requestAnimationFrame(frame);
function norm(v){var l=Math.hypot(v[0],v[1],v[2])||1;return [v[0]/l,v[1]/l,v[2]/l];}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}

})();
