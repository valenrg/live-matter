<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fault</title>
<meta name="description" content="Every earthquake on Earth, as it happens, tearing a dark crust open over a molten world.">
<meta name="theme-color" content="#040202">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: full-screen canvas, museum placard bottom-left, quiet controls bottom-right. Single dark world by choice. */
  --wall:#040202;
  --ink:#ecebf2;
  --ink-dim:#8d8b9c;
  --line:rgba(236,235,242,.18);
  --glass:rgba(14,14,20,.55);
  --accent:#ff9a3c;
  --font-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --font-body:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--wall);color:var(--ink);overflow:hidden}
body{font-family:var(--font-body);font-size:12px;line-height:1.4}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.ui{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;padding:16px;pointer-events:none;transition:opacity .8s ease}
.ui.idle{opacity:0}
.placard{pointer-events:none;max-width:62ch;display:flex;flex-direction:column;gap:5px}
.placard h1{font-family:var(--font-display);font-style:italic;font-weight:400;font-size:26px;line-height:1;margin:0 0 2px;letter-spacing:.01em}
.placard p{margin:0;color:var(--ink-dim);letter-spacing:.04em;text-transform:uppercase;font-size:10px;font-variant-numeric:tabular-nums}
.placard p.read{color:var(--ink);text-transform:none;letter-spacing:.02em;font-size:11px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:auto}
.btn{font:inherit;font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:10px;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[hidden]{display:none}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.fallback{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;background:radial-gradient(circle at 40% 60%,#8a2a08,#040202 70%)}
.fallback p{max-width:40ch;background:var(--glass);padding:14px 18px;border-radius:12px;border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.ui{transition:none}}
.meta{display:flex;align-items:center;gap:8px}.dot{width:6px;height:6px;border-radius:50%;background:var(--ink-dim);flex:none}.dot.live{background:#ff6a1a}
</style>
</head>
<body>
<canvas id="c" aria-label="Generative artwork: a dark crust of plates over molten light; each live earthquake tears a glowing fault across it that cools into a scar, while its waves heave the plates"></canvas>
<div class="fallback" id="fallback"><p id="fallbackText">This piece needs WebGL 2, which this browser did not provide. Open it in a current version of Safari, Chrome or Firefox.</p></div>

<div class="ui" id="ui">
  <div class="placard">
    <h1>Fault</h1>
    <p class="meta"><span class="dot" id="dot"></span><span>Seismic waves &middot; <span id="status">Listening for earthquakes</span></span></p>
    <p class="read" id="read">&nbsp;</p>
    <p class="read" id="pulse">&nbsp;</p>
    <p>Crust, mantle, molten floor &middot; scars fade over hours &middot; tap the crust to break it</p>
  </div>
  <div class="controls">
    <a class="btn back" href="../">&larr; Live Matter</a>

    <button class="btn" id="fsBtn" type="button" hidden>Full screen</button>
  </div>
</div>

<script>
(function(){
'use strict';
/* Shared: full screen where the browser offers it, controls that fade when untouched. */
var fsBtn=document.getElementById('fsBtn'),root=document.documentElement;
if(root.requestFullscreen&&document.fullscreenEnabled){
  fsBtn.hidden=false;
  fsBtn.addEventListener('click',function(){
    try{var pr=document.fullscreenElement?document.exitFullscreen():root.requestFullscreen();if(pr&&pr.catch)pr.catch(function(){});}catch(e){}
  });
  document.addEventListener('fullscreenchange',function(){fsBtn.textContent=document.fullscreenElement?'Exit full screen':'Full screen';});
}
var ui=document.getElementById('ui'),idleTimer=null;
function wake(){ui.classList.remove('idle');clearTimeout(idleTimer);idleTimer=setTimeout(function(){if(!ui.matches(':focus-within'))ui.classList.add('idle');},6000);}
window.__wake=wake;
document.addEventListener('keydown',wake);document.addEventListener('pointermove',wake);document.addEventListener('pointerdown',wake);wake();
window.__fail=function(msg){if(msg)document.getElementById('fallbackText').textContent=msg;document.getElementById('fallback').style.display='grid';};
window.__framed=(function(){try{return window.self!==window.top;}catch(e){return true;}})();
})();
</script>
<script>
(function(){
'use strict';
/* Fault: every earthquake on Earth, as it happens, tearing through a layered body of molten light.
   Data: USGS real-time feeds (free, no key). Geography is laid flat: longitude and latitude across, depth down.
   About two million points fill the volume in layers: a crust of plates with glowing seams, a mantle turning in
   slow convection rolls, a molten floor far below, ash drifting above. Physics kept, look abstracted:
   - each quake ruptures a fault plane of its real size (length grows tenfold for every two magnitude units),
     at its real depth, with a rupture front running across the plane;
   - it radiates spherical P and S fronts through the whole volume (S slower, shaking across instead of along),
     and surface waves that heave the crust;
   - shallow quakes that break the surface throw sparks that fly and fall under gravity, and leave a scar in the
     crust that fades over hours, so the world's seismic belts draw themselves;
   - the camera circles the latest strong quake and drifts through the layers. */
var canvas=document.getElementById('c');
var gl=canvas.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
if(!gl){window.__fail();return;}
if(!gl.getExtension('EXT_color_buffer_float')){window.__fail('This piece needs floating-point rendering, which this browser or device does not offer. Try a desktop browser.');return;}
gl.getExtension('EXT_float_blend');
var statusEl=document.getElementById('status'),readEl=document.getElementById('read'),dotEl=document.getElementById('dot');
var Q=new URLSearchParams(location.search);
var low=Q.get('q')==='low'||Math.min(screen.width,screen.height)<700;
var SCALE=low?.3:1;
var T=8;                         /* the particle layers repeat every T units; the camera only ever sees one tile's worth */
var WX=48,WZ=24;                 /* the flat Earth: 360 degrees of longitude by 180 of latitude */
var DEEP=2.4;                    /* 700 km of depth */
var PLUMES=[[1.7,2.2],[5.6,4.9],[3.1,6.8]];
var NQ=8,NSPARK=Math.round(160000*SCALE);

/* ---------- build the volume ---------- */
function rnd(){return Math.random();}
var groups=[];
(function build(){
  var nCrust=Math.round(1300000*SCALE),nMantle=Math.round(420000*SCALE),nCore=Math.round(160000*SCALE),nAsh=Math.round(50000*SCALE);
  /* plates: a Voronoi pattern on the tile, with gaps (the seams) between plates */
  var CS=.42,G=Math.round(T/CS),sites=new Float32Array(G*G*3);
  for(var j=0;j<G;j++)for(var i=0;i<G;i++){var k=(j*G+i)*3;sites[k]=(i+.15+.7*rnd())*T/G;sites[k+1]=(j+.15+.7*rnd())*T/G;sites[k+2]=rnd();}
  function nearest(x,z){var gi=Math.floor(x/T*G),gj=Math.floor(z/T*G),d1=1e9,d2=1e9,id=0;
    for(var dj=-2;dj<=2;dj++)for(var di=-2;di<=2;di++){var ii=((gi+di)%G+G)%G,jj=((gj+dj)%G+G)%G,k=(jj*G+ii)*3;
      var sx=sites[k]+Math.floor((gi+di)/G)*T,sz=sites[k+1]+Math.floor((gj+dj)/G)*T;var d=Math.hypot(x-sx,z-sz);
      if(d<d1){d2=d1;d1=d;id=k;}else if(d<d2)d2=d;}
    return [d2-d1,id];}
  var A=[],B=[];
  var crust=0,seam=0;
  while(crust+seam<nCrust){
    var x=rnd()*T,z=rnd()*T,r=nearest(x,z),e=r[0],sid=r[1];
    var hgt=(sites[sid+2]-.5)*.035;
    if(e<.03){ if(rnd()<.55){A.push(x,-.012-rnd()*.03,z,1);B.push(rnd(),e,0,0);seam++;} }
    else{var thick=rnd();A.push(x,hgt+(thick-.5)*.035*(e>.08?1:.5),z,0);B.push(rnd(),e,sites[sid+2],0);crust++;}
  }
  /* mantle: points circling in convection rolls (hot rising, cool sinking), lying along z */
  for(var m=0;m<nMantle;m++){
    var cw=1.6,cx=(Math.floor(rnd()*T/cw)+.5)*cw,cy=-.25-(DEEP-.4)*.5,rr=(Math.floor(rnd()*5)+1)/5.4+(rnd()-.5)*.025;
    A.push(cx,cy,rnd()*T,2);B.push(rnd(),rr,rnd()*6.2832,cw);
  }
  /* the molten floor, far below */
  for(var c=0;c<nCore;c++){var fx=rnd()*T,fz=rnd()*T,cell=nearest(fx*.5,fz*.5);if(cell[0]>.05&&rnd()<.85){c--;continue;}A.push(fx,-DEEP-.05-Math.pow(rnd(),3)*.25,fz,3);B.push(rnd(),cell[0],0,0);}
  /* ash drifting above */
  for(var a=0;a<nAsh;a++){A.push(rnd()*T,.05+Math.pow(rnd(),1.5)*1.6,rnd()*T,4);B.push(rnd(),0,0,0);}
  var nPl=Math.round(90000*SCALE);
  for(var q=0;q<nPl;q++){var pi=Math.floor(rnd()*PLUMES.length);A.push(PLUMES[pi][0],0,PLUMES[pi][1],8);B.push(rnd(),pi,rnd()*6.2832,Math.pow(rnd(),.7));}
  var nFar=Math.round(380000*SCALE),FT=48;
  for(var f=0;f<nFar;f++){
    var u=rnd();
    if(u<.55){var fx=rnd()*FT,fz=rnd()*FT,rr2=nearest(fx%T,fz%T);if(rr2[0]>.03&&rnd()<.8){f--;continue;}A.push(fx,rr2[0]<.03?-.02:0,fz,rr2[0]<.03?5:5.5);B.push(rnd(),rr2[0],sites[rr2[1]+2],0);}
    else if(u<.85){var gx=rnd()*FT,gz=rnd()*FT,cl=nearest(gx*.5%T,gz*.5%T);if(cl[0]>.05&&rnd()<.85){f--;continue;}A.push(gx,-DEEP-.05-Math.pow(rnd(),3)*.25,gz,6);B.push(rnd(),cl[0],0,0);}
    else{A.push(rnd()*FT,-.3-rnd()*(DEEP-.4),rnd()*FT,7);B.push(rnd(),0,0,0);}
  }
  groups.total=A.length/4;
  groups.A=new Float32Array(A);groups.B=new Float32Array(B);
})();

var VS_PTS=['#version 300 es','precision highp float;',
'in vec4 aA;in vec4 aB;',
'uniform mat4 uVP;uniform vec3 uCam;uniform float uT,uFocus,uAp,uPx,uTile,uDeep;uniform vec4 uQ0[8],uQ1[8],uQ2[8];uniform int uQN;',
'uniform sampler2D uScar;uniform vec2 uWorld;uniform float uPulse;',
'out vec3 vCol;out float vSoft;',
'float h1(float x){return fract(sin(x*127.1)*43758.5453);}',
'vec3 lava(float t){t=clamp(t,0.,1.6);',
' vec3 a=vec3(.28,.025,.006),b=vec3(.95,.14,.02),c=vec3(1.,.48,.07),d=vec3(1.,.84,.38),e=vec3(1.,.97,.88);',
' return t<.25?mix(vec3(.05,.01,.004),a,t/.25):t<.5?mix(a,b,(t-.25)/.25):t<.8?mix(b,c,(t-.5)/.3):t<1.1?mix(c,d,(t-.8)/.3):mix(d,e,clamp((t-1.1)/.5,0.,1.));}',
'void main(){',
' float kind=aA.w;vec3 p=aA.xyz;float seed=aB.x;bool far=kind>4.75;if(far)kind=kind==5.?1.:(kind==5.5?0.:(kind==6.?3.:2.5));',
/* mantle convection: each point travels round its roll; hotter where it rises */
' float rise=0.;',
' if(kind==2.){float w=aB.w,H=uDeep-.4;float ang=aB.z+uT*(.05+.03*h1(seed*9.))/(.3+aB.y);',
'  p.x=aA.x+cos(ang)*aB.y*w*.46;p.y=aA.y+sin(ang)*aB.y*H*.46;rise=-sin(ang+1.5708)*sign(fract(aA.x/(w*2.))-.5);}',
' float ph=0.;',
' if(kind==8.){ph=fract(seed*7.31+uT*(.012+.010*h1(seed*3.))*(.5+uPulse));',
'  float r=(.035+.05*aB.w)*(1.+.4*sin(ph*20.+seed*9.))+smoothstep(.78,1.,ph)*.75*aB.w;',
'  float ang=aB.z+uT*.15*(1.-ph);p.x=aA.x+cos(ang)*r;p.z=aA.z+sin(ang)*r;p.y=mix(-uDeep-.05,-.26,ph);}',
' if(kind==4.){p.x+=sin(uT*.05+seed*40.)*.2;p.z+=cos(uT*.04+seed*30.)*.2;p.y=.05+mod(aA.y-.05+.025*uT*(.2+seed),1.6);}',
/* place this point on the copy of its tile nearest the camera */
' float tile=far?48.:uTile;p.xz+=floor((uCam.xz-p.xz)/tile+.5)*tile;',
' float hd=length(p.xz-uCam.xz);',
' float reach=far?smoothstep(3.,4.2,hd)*smoothstep(26.,13.,hd):smoothstep(4.1,3.1,hd);',   /* near and far fields cross-fade in a circle */
/* the layers are not flat: long swells and folds, in world space */
' vec2 w=p.xz;float rel=.24*sin(w.x*.53+w.y*.21)+.16*sin(w.y*.71-w.x*.37+1.3)+.07*sin(w.x*1.7+w.y*1.3+2.)+.04*sin(w.x*3.1-w.y*2.3);',
' float floorY=rel*.35+.28*sin(w.x*.31-w.y*.44)+.12*sin(w.y*.9+w.x*.6);',
' p.y+=kind==3.?floorY:(kind==8.?mix(floorY,rel*.85,ph):(kind==2.||kind==2.5?rel*.6:rel));',
' float heat=kind==0.?.05+.04*aB.z:(kind==1.?.30+.10*sin(uT*.6+seed*60.):(kind==2.?.20+.38*smoothstep(-.3*uDeep,-uDeep,p.y)+.12*rise:(kind==2.5?.35+.3*seed:(kind==3.?.85:.10))));',
' float glow=kind==0.?.035:(kind==1.?.9:(kind==2.?.55:(kind==2.5?.9:(kind==3.?1.1:.14))));if(far)glow*=kind==0.?3.:1.6;',
/* scars of past quakes, from a slow map in world coordinates */
' if(kind==8.){heat=1.05-.55*ph+.15*uPulse;glow=.55*(.45+uPulse)*(1.-smoothstep(.88,1.,ph))*smoothstep(0.,.04,ph);}',
/* the floor breathes with the energy released on the whole planet in the last hour, and glows where plumes rise */
' if(kind==3.){vec2 tp=mod(aA.xz,8.);float rt=0.;',
'  for(int i=0;i<3;i++){vec2 pc=i==0?vec2(1.7,2.2):(i==1?vec2(5.6,4.9):vec2(3.1,6.8));vec2 dd=tp-pc;dd-=floor(dd/8.+.5)*8.;rt+=exp(-dot(dd,dd)/.09);}',
'  glow*=.30+1.25*uPulse+rt*1.2;heat=.62+.35*uPulse+.25*rt;}',
' if(kind<2.){vec2 su=vec2(fract(p.x/uWorld.x),p.z/uWorld.y);float sc=texture(uScar,su).r;heat+=sc*(kind==1.?1.1:.45);glow+=sc*(kind==1.?1.6:.5);}',
' vec3 disp=vec3(0.);',
' for(int k=0;k<8;k++){if(k>=uQN)break;',
'  vec4 q0=uQ0[k],q1=uQ1[k],q2=uQ2[k];',      /* q0: hypocentre xyz, start time; q1: strike, dip, half-length, magnitude; q2: amplitude, ... */
'  vec3 d=p-q0.xyz;d.x-=floor(d.x/'+WX.toFixed(1)+'+.5)*'+WX.toFixed(1)+';',
'  float tau=uT-q0.w;if(tau<0.)continue;',
'  float r=length(d);float A=q2.x;',
'  if(r>tau*1.7+1.8&&r>q1.z*2.+.5)continue;',
/* fault plane: along strike s, down dip u, normal n */
'  vec3 st=vec3(cos(q1.x),0.,sin(q1.x));vec3 dn=vec3(-sin(q1.x)*cos(q1.y),-sin(q1.y),cos(q1.x)*cos(q1.y));vec3 nr=cross(st,dn);',
'  float s=dot(d,st),u=dot(d,dn),n=dot(d,nr);float L=q1.z,Wd=q1.z*.55;',
'  float ds=max(abs(s)-L,0.),du=max(abs(u)-Wd,0.);float df=sqrt(ds*ds+du*du+n*n);',
'  float tf=length(vec2(s,u))/1.1;',                                    /* rupture front speed */
'  float age=tau-tf;',
'  if(age>0.){float w=.010+.012*L;float on=exp(-df*df/(w*w));',
'   heat+=on*1.5*exp(-age/9.)*(.6+.4*exp(-age*3.));glow+=on*3.*exp(-age/8.);',
'   disp+=nr*sign(n)*on*min(age*.15,.02)*min(L*4.,1.);}',               /* the fault opens */
/* body waves: spherical fronts, P along the ray, S across it */
'  float sp=r-1.55*tau,ss=r-.90*tau;float fP=exp(-sp*sp/.004),fS=exp(-ss*ss/.008);',
'  float att=A/(.25+r)*exp(-tau*.18);',
'  vec3 rad=d/max(r,1e-3);vec3 tan_=normalize(cross(rad,vec3(.3,1.,.2)));',
'  float ad=min(att,2.);disp+=rad*fP*ad*.022*sin(sp*60.)+tan_*fS*ad*.03*sin(ss*40.);',
'  float wa=min(att*.6,1.2)*(kind==4.?.12:(kind==2.?1.:.8));',
'  float fr=max(fP,fS*.8);heat=mix(heat,max(heat,.5+.35*min(wa,1.)),fr);glow+=(fP*.30+fS*.22)*wa;',
/* the floor is hit: it flashes, and the front bounces back up as a fainter echo (as waves reflect off the core) */
'  if(kind==3.){float hit=fP*min(A*.35,3.)*exp(-tau*.12);glow+=hit*1.4;heat=mix(heat,1.15,min(hit,1.));}',
'  else{float yf=-uDeep-.05;vec3 d2=vec3(d.x,p.y-(2.*yf-q0.y),d.z);float r2=length(d2);',
'   float se=r2-1.55*tau;float fE=exp(-se*se/.006)*step(yf,p.y);float aE=min(.5*A/(.25+r2)*exp(-tau*.18),1.);',
'   heat=mix(heat,max(heat,.55),fE*aE);glow+=fE*aE*.28*(kind==4.?.3:1.);}',
/* surface waves on the crust: a slow, large ring that lifts the plates */
'  if(kind<2.||kind==4.){float rs=length(d.xz)-.62*tau;float fR=exp(-rs*rs/.03);',
'   float aR=A*exp(q2.w*1.2)/(.4+sqrt(length(d.xz)))*exp(-tau*.12);',
'   disp.y+=fR*min(aR,2.)*.05*cos(rs*14.);heat=mix(heat,max(heat,.55+.25*min(aR,1.)*(kind==1.?1.3:1.)),fR);glow+=fR*min(aR,1.5)*(kind==1.?1.2:(kind==4.?.08:.3));}',
' }',
' p+=disp;',
' p.y-=hd*hd/64.;',
' vec4 c=uVP*vec4(p,1.);gl_Position=c;',
' float dist=max(c.w,.02);',
' float coc=uAp*abs(dist-uFocus)/dist;',                                /* the lens: out of focus, a disc */
' float size=max(uPx,min(coc,46.));gl_PointSize=size;',
' float e=(uPx*uPx)/(size*size);',
' float fog=exp(-max(dist-2.4,0.)*.10)*reach;',
' vCol=lava(heat)*glow*e*fog;',
' vSoft=size>3.?1.:0.;',
' if(glow*fog<.002)gl_Position=vec4(2.,2.,2.,1.);',
'}'].join('\n');
var FS_PTS=['#version 300 es','precision mediump float;','in vec3 vCol;in float vSoft;out vec4 o;',
'void main(){vec2 q=gl_PointCoord*2.-1.;float r=dot(q,q);if(r>1.)discard;',
' float a=mix(1.-r*.5,smoothstep(1.,.75,r)*(.75+.25*r),vSoft);o=vec4(vCol*a,1.);}'].join('\n');

/* sparks: thrown from where a fault breaks the surface, flying and falling, cooling as they go */
var VS_SPK=['#version 300 es','precision highp float;',
'uniform mat4 uVP;uniform vec3 uCam;uniform float uT,uFocus,uAp,uPx;uniform vec4 uQ0[8],uQ1[8],uQ2[8];uniform int uQN;',
'out vec3 vCol;out float vSoft;',
'float h1(float x){return fract(sin(x*127.1)*43758.5453);}',
'vec3 lava(float t){t=clamp(t,0.,1.6);vec3 b=vec3(.95,.14,.02),c=vec3(1.,.48,.07),d=vec3(1.,.84,.38),e=vec3(1.,.97,.88);',
' return t<.5?mix(vec3(.2,.02,.005),b,t/.5):t<.8?mix(b,c,(t-.5)/.3):t<1.1?mix(c,d,(t-.8)/.3):mix(d,e,clamp((t-1.1)/.5,0.,1.));}',
'void main(){',
' float id=float(gl_VertexID);int k=int(mod(id,8.));gl_Position=vec4(2.,2.,2.,1.);vCol=vec3(0.);vSoft=0.;',
' if(k>=uQN)return;',
' vec4 q0=uQ0[k],q1=uQ1[k],q2=uQ2[k];',
' float share=q2.y;if(h1(id*.731)>share)return;',                      /* how many sparks this quake gets */
' float L=q1.z;vec3 st=vec3(cos(q1.x),0.,sin(q1.x));',
' float s=(h1(id*1.37)*2.-1.)*L;',
' vec3 o=vec3(q0.x,0.,q0.z)+st*s;vec2 w=o.xz;o.y=.24*sin(w.x*.53+w.y*.21)+.16*sin(w.y*.71-w.x*.37+1.3)+.07*sin(w.x*1.7+w.y*1.3+2.)+.04*sin(w.x*3.1-w.y*2.3);',
' float born=q0.w+abs(s)/1.1+h1(id*2.9)*1.8*sqrt(L*4.);',
' float t=uT-born;float life=1.5+3.*h1(id*4.1);',
' if(t<0.||t>life)return;',
