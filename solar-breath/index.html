<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar Breath</title>
<meta name="description" content="Curtains of aurora over a still northern lake, driven by the live solar wind.">
<meta name="theme-color" content="#02040a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: full-screen canvas, museum placard bottom-left, quiet controls bottom-right. Single dark world by choice. */
  --wall:#02040a;
  --ink:#ecebf2;
  --ink-dim:#8d8b9c;
  --line:rgba(236,235,242,.18);
  --glass:rgba(14,14,20,.55);
  --accent:#7dffb2;
  --font-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --font-body:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--wall);color:var(--ink);overflow:hidden}
body{font-family:var(--font-body);font-size:12px;line-height:1.4}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.ui{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;padding:16px;pointer-events:none;transition:opacity .8s ease}
.ui.idle{opacity:0}
.placard{pointer-events:none;max-width:62ch;display:flex;flex-direction:column;gap:5px}
.placard h1{font-family:var(--font-display);font-style:italic;font-weight:400;font-size:26px;line-height:1;margin:0 0 2px;letter-spacing:.01em}
.placard p{margin:0;color:var(--ink-dim);letter-spacing:.04em;text-transform:uppercase;font-size:10px;font-variant-numeric:tabular-nums}
.placard p.read{color:var(--ink);text-transform:none;letter-spacing:.02em;font-size:11px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:auto}
.btn{font:inherit;font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:10px;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[hidden]{display:none}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.fallback{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;background:#02040a}
.fallback p{max-width:40ch;background:var(--glass);padding:14px 18px;border-radius:12px;border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.ui{transition:none}}

</style>
</head>
<body>
<canvas id="c" aria-label="Generative artwork: folded curtains of aurora above a dark lake, mirrored in the water, driven by live solar wind data from NOAA"></canvas>
<div class="fallback" id="fallback"><p id="fallbackText">This piece needs WebGL 2, which this browser did not provide. Open it in a current version of Safari, Chrome or Firefox.</p></div>

<div class="ui" id="ui">
  <div class="placard">
    <h1>Solar Breath</h1>
    <p>Emission lines &middot; <span id="status">Connecting to NOAA</span> &middot; tap to brighten a curtain</p>
    <p class="read" id="read">&nbsp;</p>
  </div>
  <div class="controls">
    <a class="btn back" href="../">&larr; Live Matter</a>

    <button class="btn" id="fsBtn" type="button" hidden>Full screen</button>
  </div>
</div>

<script>
(function(){
'use strict';
/* Shared: full screen where the browser offers it, controls that fade when untouched. */
var fsBtn=document.getElementById('fsBtn'),root=document.documentElement;
if(root.requestFullscreen&&document.fullscreenEnabled){
  fsBtn.hidden=false;
  fsBtn.addEventListener('click',function(){
    try{var pr=document.fullscreenElement?document.exitFullscreen():root.requestFullscreen();if(pr&&pr.catch)pr.catch(function(){});}catch(e){}
  });
  document.addEventListener('fullscreenchange',function(){fsBtn.textContent=document.fullscreenElement?'Exit full screen':'Full screen';});
}
var ui=document.getElementById('ui'),idleTimer=null;
function wake(){ui.classList.remove('idle');clearTimeout(idleTimer);idleTimer=setTimeout(function(){if(!ui.matches(':focus-within'))ui.classList.add('idle');},6000);}
window.__wake=wake;
document.addEventListener('keydown',wake);document.addEventListener('pointermove',wake);document.addEventListener('pointerdown',wake);wake();
window.__fail=function(msg){if(msg)document.getElementById('fallbackText').textContent=msg;document.getElementById('fallback').style.display='grid';};
window.__framed=(function(){try{return window.self!==window.top;}catch(e){return true;}})();
})();
</script>
<script>
(function(){
'use strict';
/* Solar Breath, emission study: only the light itself, curtains of aurora at several distances on a black sky, driven by the live solar wind measured
   a million and a half kilometres from Earth (NOAA Space Weather Prediction Center, free, no key).
   Kp (the planetary geomagnetic index) sets how high and bright the curtains rise;
   a southward magnetic field (negative Bz) lets the wind couple to Earth and makes them surge;
   wind speed sets how fast the folds travel; density thickens the light.
   Strong storms bring red high above the green and a violet fringe below. Tap to pluck a curtain. */

var canvas=document.getElementById('c');
var gl=canvas.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
if(!gl){window.__fail();return;}
var statusEl=document.getElementById('status'),readEl=document.getElementById('read');

var VS='#version 300 es\nin vec2 aPos;out vec2 vUv;void main(){vUv=aPos*.5+.5;gl_Position=vec4(aPos,0.,1.);}';
var FS=['#version 300 es','precision highp float;','in vec2 vUv;out vec4 o;',
'uniform vec2 uRes;uniform float uT,uClk,uAct,uSpeed,uDens,uRed,uPulse,uYaw,uPitch;uniform vec3 uPl;',
'float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}',
'float h1(float x){return fract(sin(x*127.1)*43758.5453);}',
'float n1(float x){float i=floor(x),f=fract(x);f=f*f*f*(f*(f*6.-15.)+10.);return mix(h1(i),h1(i+1.),f);}',
'float fbm1(float x){return n1(x)*.52+n1(x*2.13+3.1)*.28+n1(x*4.37+7.7)*.13+n1(x*9.1+1.3)*.07;}',
/* Seen from a lake shore, looking north. Each curtain is a real sheet of light hanging along the magnetic field
   between about 100 and 300 km up (1 unit = 10 km). In plan it folds and kinks like a ribbon in the wind; the folds
   travel along it at a speed set by the solar wind, and the whole sheet drifts toward or away from us. */
'float zc(float i,float x,float y,float t){',
' float sp=(.012+.05*uSpeed)*(1.+.25*i);',
' float A=(6.+9.*uAct)*(1.+.25*i);',
' float z=22.+i*24.+i*i*5.+7.*sin(uClk*.021+i*2.1)+4.*sin(uClk*.047+i*5.3);',
' z+=A*2.*(fbm1(x*.018-t*sp+i*13.7)-.5);',
' z+=A*.75*(n1(x*.06+t*sp*2.6+i*4.1)-.5);',
' z+=A*.14*(n1(x*.31-t*sp*5.+i*9.)-.5)*(.5+uAct);',
' z+=(y-10.)*.16;',
' return z;}',
'vec3 emit(float i,vec3 P,float t,float az,float dist){',
' float x=P.x;',
' float yb=9.+1.6*(fbm1(x*.04+t*.05+i*3.)-.5)*2.-uAct*1.4;',
' float H=2.2+4.5*uAct+1.5*uDens;',
' float h=P.y-yb;',
' float env=smoothstep(.25,.62,fbm1(x*.011-t*(.01+.03*uSpeed)+i*7.3));',
' env*=.55+.45*n1(x*.05+t*.2+i);',
' float sp=.3+1.6*uSpeed;',
' float lod=smoothstep(30.,110.,dist);',
' float r=mix(n1(x*1.7+t*sp+i*5.)*.6+n1(x*4.3-t*sp*1.3+i)*.4,n1(x*.9+t*sp*.7+i*5.),lod);',
' float rays=.35+1.1*pow(r,2.);',
' float prof=smoothstep(-.25,.35,h)*exp(-max(h,0.)/H)*(1.+1.6*exp(-max(h,0.)/.7));',
' float red=smoothstep(yb+H*1.1,yb+H*3.,P.y)*exp(-max(h-H*3.5,0.)/H);',
' float fringe=exp(-pow(h+.1,2.)/.09)*(.6+1.1*smoothstep(.3,.8,uAct));',
' float pls=1.+uPulse*1.2*n1(x*.08+t*1.5)+2.2*uPl.z*exp(-pow(az-uPl.x-uPl.y*.25*sign(az-uPl.x),2.)/.004)*exp(-uPl.y*1.1);',
' vec3 green=vec3(.36,1.,.22),redc=vec3(1.,.16,.20),vio=vec3(.55,.22,1.);',
' vec3 c=green*prof*rays;',
' c+=redc*red*(.16+.45*uRed*uRed)*(.6+.4*rays);',
' c+=vio*fringe*rays*1.7;',
' return c*env*pls*(.30+1.1*uAct);}',
'vec3 sky(vec3 ro,vec3 rd,float t,float steps){',
' vec3 acc=vec3(0.);',
' if(rd.y<.002)return acc;',
' float ta=(6.5-ro.y)/rd.y,tb=min((34.-ro.y)/rd.y,700.);',
' if(ta>=tb)return acc;',
' float az=atan(rd.x,rd.z);',
' for(int k=0;k<5;k++){',
'  float i=float(k);',
'  float z0=10.+i*24.+i*i*5.-22.-6.*i,z1=z0+56.+14.*i;',
'  float s0=ta,s1=tb;',
'  if(rd.z>.01){s0=max(s0,(z0-ro.z)/rd.z);s1=min(s1,(z1+4.-ro.z)/rd.z);}',
'  if(s0>=s1)continue;',
'  float dt=(s1-s0)/steps;',
'  float jit=hash(gl_FragCoord.xy+i*17.+fract(uClk)*3.);',
'  float tp=s0;vec3 P=ro+rd*tp;float fp=P.z-zc(i,P.x,P.y,t);',
'  for(int s=1;s<=40;s++){',
'   if(float(s)>steps)break;',
'   float tc=s0+dt*(float(s)-.5+jit);if(s==int(steps))tc=s1;',
'   vec3 Q=ro+rd*tc;float fc=Q.z-zc(i,Q.x,Q.y,t);',
'   if(sign(fc)!=sign(fp)){',
'    float tx=tp+(tc-tp)*fp/(fp-fc);vec3 X=ro+rd*tx;',
'    float e=.6;float gx=(zc(i,X.x+e,X.y,t)-zc(i,X.x-e,X.y,t))/(2.*e);',
'    vec3 n=normalize(vec3(-gx,-.16,1.));',
'    float w=min(1./max(abs(dot(n,rd)),.3),3.);',
'    float ext=exp(-tx*.0035)*smoothstep(z1,z1-10.,X.z)*smoothstep(z0,z0+10.,X.z);',
'    acc+=emit(i,X,t,az,tx)*w*ext*(1.-.12*i);',
'   }',
'   tp=tc;fp=fc;',
'  }',
' }',
' return acc*.55;}',
'void main(){',
' vec2 s=(gl_FragCoord.xy-.5*uRes)/uRes.y;',
' vec3 rd=normalize(vec3(s*1.15,1.));',
' float cp=cos(uPitch),sp=sin(uPitch);rd=vec3(rd.x,rd.y*cp+rd.z*sp,-rd.y*sp+rd.z*cp);',
' float cy=cos(uYaw),sy=sin(uYaw);rd.xz=mat2(cy,-sy,sy,cy)*rd.xz;',
' vec3 ro=vec3(0.,.02,0.);float t=uT;',
' float az=atan(rd.x,rd.z);',
/* far shoreline: low hills and forest, black, a few degrees high */
' float ridge=0.;',
' vec3 col;',
' float el=rd.y;',
' if(el>ridge){',
'  col=vec3(.002,.003,.008)+vec3(.010,.026,.014)*exp(-el*9.);',
'  vec2 sc=floor(vec2(az,el)*vec2(420.,420.));float st=hash(sc);',
'  col+=vec3(.9,.95,1.)*smoothstep(.9975,1.,st)*.9*(.6+.4*sin(uClk*2.+st*90.));',
'  col+=vec3(.012,.035,.02)*exp(-el*22.)*(.4+.6*uAct);\n  col+=sky(ro,rd,t,30.);',
' }else if(el>0.){',
'  col=vec3(.0015,.002,.003)+sky(ro,vec3(rd.x,ridge+.004,rd.z),t,10.)*.025;',
' }else{',
/* the lake: a dark mirror, broken into ripples, that doubles the light below the shore */
'  float d=ro.y/max(-el,.0005);vec2 wp=ro.xz+rd.xz*d;',
'  float rip=(n1(wp.x*3.1+uClk*.5)-.5)+(n1(wp.y*2.3-uClk*.4+wp.x*.7)-.5);',
'  vec3 rr=normalize(vec3(rd.x+rip*.006,-el+rip*.006*(1.+14.*-el),rd.z));',
'  float rel=rr.y;',
'  vec3 refl;',
'  if(rel<ridge)refl=vec3(.0015,.002,.003);',
'  else refl=vec3(.002,.003,.008)+vec3(.010,.026,.014)*exp(-rel*9.)+vec3(.012,.035,.02)*exp(-rel*22.)*(.4+.6*uAct)+sky(ro,rr,t,12.);',
'  float fres=.22+.65*pow(1.-clamp(-el*4.,0.,1.),2.);',
'  col=refl*fres*.8+vec3(.001,.0015,.003);',
' }',
' col=1.-exp(-col*1.7);',
' col=pow(col,vec3(.95));',
' o=vec4(col,1.);',
'}'].join('\n');

function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s));throw new Error('shader');}return s;}
var prog;
try{
  prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
  gl.bindAttribLocation(prog,0,'aPos');gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
}catch(e){window.__fail();return;}
var U={};['uRes','uT','uClk','uAct','uSpeed','uDens','uRed','uPulse','uYaw','uPitch','uPl'].forEach(function(n){U[n]=gl.getUniformLocation(prog,n);});
var vbo=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

/* The light is soft, so the sky is rendered at reduced resolution into a buffer that keeps a running average of
   recent frames: the sampling noise of each frame dissolves into smooth light, then it is scaled up to the screen. */
var FS_SHOW=['#version 300 es','precision highp float;','in vec2 vUv;out vec4 o;','uniform sampler2D uAcc;uniform vec2 uRes;uniform float uClk;',
'float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}',
'void main(){vec3 c=texture(uAcc,vUv).rgb;',
' vec2 vv=vUv-.5;c*=1.-.45*dot(vv,vv);',
' c+=(hash(gl_FragCoord.xy+fract(uClk)*61.)-.5)*.006;o=vec4(c,1.);}'].join('\n');
var progShow;
try{
  progShow=gl.createProgram();gl.attachShader(progShow,sh(gl.VERTEX_SHADER,VS));gl.attachShader(progShow,sh(gl.FRAGMENT_SHADER,FS_SHOW));
  gl.bindAttribLocation(progShow,0,'aPos');gl.linkProgram(progShow);
  if(!gl.getProgramParameter(progShow,gl.LINK_STATUS))throw new Error('show');
}catch(e){window.__fail();return;}
var US={uAcc:gl.getUniformLocation(progShow,'uAcc'),uRes:gl.getUniformLocation(progShow,'uRes'),uClk:gl.getUniformLocation(progShow,'uClk')};
var half=!!gl.getExtension('EXT_color_buffer_float');gl.getExtension('EXT_float_blend');
var W=1,H=1,CW=1,CH=1,acc=null,fresh=true;
function resize(){
  var dpr=Math.min(window.devicePixelRatio||1,1.25);
  var cw=Math.max(1,Math.round(canvas.clientWidth*dpr)),ch=Math.max(1,Math.round(canvas.clientHeight*dpr));
  if(cw===CW&&ch===CH&&acc)return;CW=cw;CH=ch;canvas.width=cw;canvas.height=ch;
  W=Math.max(1,Math.round(cw*.6));H=Math.max(1,Math.round(ch*.6));
  if(acc){gl.deleteTexture(acc.tex);gl.deleteFramebuffer(acc.fb);}
  var tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,half?gl.RGBA16F:gl.RGBA8,W,H,0,gl.RGBA,half?gl.HALF_FLOAT:gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  var fb=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE&&half){half=false;gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.deleteFramebuffer(fb);gl.deleteTexture(tex);acc=null;CW=0;resize();return;}
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);acc={tex:tex,fb:fb};fresh=true;
}
window.addEventListener('resize',resize);resize();

/* ---------- space weather ---------- */
var BASE='https://services.swpc.noaa.gov/';
var sw={speed:400,dens:5,bz:0,bt:5,kp:2,live:false,sim:false,when:null};
function num(v){var n=typeof v==='number'?v:parseFloat(v);return isFinite(n)?n:null;}
/* NOAA files are arrays of objects (or, in older products, a header row then arrays). Take the newest usable record. */
function rows(json){
  if(!Array.isArray(json)||!json.length)return [];
  if(Array.isArray(json[0])){var hd=json[0];return json.slice(1).map(function(r){var o={};hd.forEach(function(k,i){o[k]=r[i];});return o;});}
  return json;
}
function newest(list,key){
  var best=null;
  for(var i=0;i<list.length;i++){var r=list[i];if(r.active===false)continue;if(num(r[key])==null)continue;if(!best||String(r.time_tag)>String(best.time_tag))best=r;}
  return best;
}
function getJSON(path){return fetch(BASE+path,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}
function poll(){
  Promise.all([
    getJSON('json/rtsw/rtsw_wind_1m.json').then(function(j){var r=newest(rows(j),'proton_speed');if(r){sw.speed=num(r.proton_speed);var d=num(r.proton_density);if(d!=null)sw.dens=d;sw.when=r.time_tag;}}),
    getJSON('json/rtsw/rtsw_mag_1m.json').then(function(j){var r=newest(rows(j),'bz_gsm');if(r){sw.bz=num(r.bz_gsm);var b=num(r.bt);if(b!=null)sw.bt=b;}}),
    getJSON('json/planetary_k_index_1m.json').then(function(j){
      var L=rows(j),r=null,key=null;
      ['estimated_kp','kp_index','Kp','kp'].some(function(k){r=newest(L,k);if(r){key=k;return true;}return false;});
      if(r)sw.kp=num(r[key]);
    })
  ]).then(function(){
    sw.live=true;sw.sim=false;statusEl.textContent='Live from NOAA · '+state(sw.kp);
  }).catch(function(){
    if(!sw.live)startSim();else statusEl.textContent='Waiting for NOAA · showing the last reading';
  });
}
function state(kp){
  if(kp>=9)return 'extreme storm (G5)';if(kp>=8)return 'severe storm (G4)';if(kp>=7)return 'strong storm (G3)';
  if(kp>=6)return 'moderate storm (G2)';if(kp>=5)return 'minor storm (G1)';if(kp>=4)return 'active';if(kp>=3)return 'unsettled';return 'quiet';
}
function startSim(){
  if(sw.sim)return;sw.sim=true;
  statusEl.textContent='Preview with simulated solar wind';
}
poll();setInterval(poll,60000);

/* ---------- pluck ---------- */
var pl=[0,-99,0],clock=0,yawNow=0;
canvas.addEventListener('pointerdown',function(ev){
  var r=canvas.getBoundingClientRect();
  var sx=((ev.clientX-r.left)-r.width/2)/r.height*1.15;
  pl=[Math.atan(sx)+yawNow,clock,1];
});

/* ---------- loop ---------- */
var calm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var t=Math.random()*1000,last=performance.now(),cur={act:.3,speed:.2,dens:.3,red:0},pulse=0,nextSub=20,shown=0;
function clamp(x){return Math.max(0,Math.min(1,x));}
function frame(now){
  requestAnimationFrame(frame);
  resize();
  var dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  if(sw.sim){
    /* a slow made-up storm cycle so the preview shows the whole range */
    var c=.5+.5*Math.sin(clock*.035);
    sw.kp=1.5+6*c*c;sw.bz=-12*c*c+3*(1-c)+2*Math.sin(clock*.3);sw.speed=380+320*c;sw.dens=4+10*c;
  }
  var kpN=clamp(sw.kp/9),bzN=clamp(-sw.bz/15),spN=clamp((sw.speed-300)/500),dnN=clamp(Math.log(Math.max(1,sw.dens))/Math.log(30));
  var actT=clamp(.12+.62*kpN+.32*bzN+.1*spN);
  var k=1-Math.pow(.92,dt);
  cur.act+=(actT-cur.act)*k;cur.speed+=(spN-cur.speed)*k;cur.dens+=(dnN-cur.dens)*k;
  cur.red+=(clamp((cur.act-.55)/.35)-cur.red)*k;
  /* substorms: sudden brightenings, more often when the field points south */
  nextSub-=dt*(1+bzN*4+kpN*2);
  if(nextSub<=0){pulse=.6+.6*Math.random()*(.3+bzN);nextSub=40+Math.random()*80;}
  pulse*=Math.pow(.6,dt);
  t+=dt*(calm?.35:1);
  gl.bindFramebuffer(gl.FRAMEBUFFER,acc.fb);gl.viewport(0,0,W,H);gl.useProgram(prog);
  /* blend each new frame into the running average (the first frame is written whole) */
  gl.enable(gl.BLEND);gl.blendFunc(gl.CONSTANT_ALPHA,gl.ONE_MINUS_CONSTANT_ALPHA);gl.blendColor(0,0,0,fresh?1:.14);fresh=false;
  gl.uniform2f(U.uRes,W,H);gl.uniform1f(U.uT,t);gl.uniform1f(U.uAct,cur.act);gl.uniform1f(U.uSpeed,cur.speed);
  gl.uniform1f(U.uDens,cur.dens);gl.uniform1f(U.uRed,cur.red);gl.uniform1f(U.uPulse,pulse);
  /* the viewer turns slowly along the shore, looking a little up */
  yawNow=.62+.20*Math.sin(clock*.011)+.07*Math.sin(clock*.027+1.);
  gl.uniform1f(U.uClk,clock);gl.uniform1f(U.uYaw,yawNow);gl.uniform1f(U.uPitch,.20+.03*Math.sin(clock*.017));
  gl.uniform3f(U.uPl,pl[0],clock-pl[1],pl[2]);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.disable(gl.BLEND);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,CW,CH);gl.useProgram(progShow);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,acc.tex);
  gl.uniform1i(US.uAcc,0);gl.uniform2f(US.uRes,CW,CH);gl.uniform1f(US.uClk,clock);
  gl.drawArrays(gl.TRIANGLES,0,3);
  if(++shown%30===0){
    var bz=sw.bz;
    readEl.textContent='wind '+Math.round(sw.speed)+' km/s · density '+sw.dens.toFixed(1)+' /cm³ · Bz '+(bz<0?'−':'+')+Math.abs(bz).toFixed(1)+' nT · Kp '+sw.kp.toFixed(1);
    if(sw.sim)statusEl.textContent='Preview with simulated solar wind · '+state(sw.kp);
  }
}
requestAnimationFrame(frame);
})();

</script>
