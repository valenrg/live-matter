<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murmuration</title>
<meta name="description" content="A flock of starlings over a dusk marsh, moved by everything happening on Bluesky right now.">
<meta name="theme-color" content="#120f17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: full-screen canvas, museum placard bottom-left, quiet controls bottom-right. Single dark world by choice. */
  --wall:#120f17;
  --ink:#ecebf2;
  --ink-dim:#8d8b9c;
  --line:rgba(236,235,242,.18);
  --glass:rgba(14,14,20,.55);
  --accent:#ffc9a8;
  --font-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --font-body:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--wall);color:var(--ink);overflow:hidden}
body{font-family:var(--font-body);font-size:12px;line-height:1.4}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.ui{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;padding:16px;pointer-events:none;transition:opacity .8s ease}
.ui.idle{opacity:0}
.placard{pointer-events:none;max-width:62ch;display:flex;flex-direction:column;gap:5px}
.placard h1{font-family:var(--font-display);font-style:italic;font-weight:400;font-size:26px;line-height:1;margin:0 0 2px;letter-spacing:.01em}
.placard p{margin:0;color:var(--ink-dim);letter-spacing:.04em;text-transform:uppercase;font-size:10px;font-variant-numeric:tabular-nums}
.placard p.read{color:var(--ink);text-transform:none;letter-spacing:.02em;font-size:11px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:auto}
.btn{font:inherit;font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:10px;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[hidden]{display:none}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.fallback{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;background:#3a3552}
.fallback p{max-width:40ch;background:var(--glass);padding:14px 18px;border-radius:12px;border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.ui{transition:none}}

</style>
</head>
<body>
<canvas id="c" aria-label="Generative artwork: thousands of starlings wheeling over a dusk marsh, moved by live Bluesky activity"></canvas>
<div class="fallback" id="fallback"><p id="fallbackText">This piece needs WebGL 2, which this browser did not provide. Open it in a current version of Safari, Chrome or Firefox.</p></div>

<div class="ui" id="ui">
  <div class="placard">
    <h1>Murmuration</h1>
    <p><span id="status">Connecting to Bluesky</span> &middot; move or touch to be the falcon</p>
    <p class="read" id="rates">&nbsp;</p>
  </div>
  <div class="controls">
    <a class="btn back" href="../">&larr; Live Matter</a>

    <button class="btn" id="fsBtn" type="button" hidden>Full screen</button>
  </div>
</div>

<script>
(function(){
'use strict';
/* Shared: full screen where the browser offers it, controls that fade when untouched. */
var fsBtn=document.getElementById('fsBtn'),root=document.documentElement;
if(root.requestFullscreen&&document.fullscreenEnabled){
  fsBtn.hidden=false;
  fsBtn.addEventListener('click',function(){
    try{var pr=document.fullscreenElement?document.exitFullscreen():root.requestFullscreen();if(pr&&pr.catch)pr.catch(function(){});}catch(e){}
  });
  document.addEventListener('fullscreenchange',function(){fsBtn.textContent=document.fullscreenElement?'Exit full screen':'Full screen';});
}
var ui=document.getElementById('ui'),idleTimer=null;
function wake(){ui.classList.remove('idle');clearTimeout(idleTimer);idleTimer=setTimeout(function(){if(!ui.matches(':focus-within'))ui.classList.add('idle');},6000);}
window.__wake=wake;
document.addEventListener('keydown',wake);document.addEventListener('pointermove',wake);document.addEventListener('pointerdown',wake);wake();
window.__fail=function(msg){if(msg)document.getElementById('fallbackText').textContent=msg;document.getElementById('fallback').style.display='grid';};
window.__framed=(function(){try{return window.self!==window.top;}catch(e){return true;}})();
})();
</script>
<script>
(function(){
'use strict';
/* Murmuration: a flock of starlings over a dusk marsh, moved by everything happening on Bluesky right now.
   Each new post sends a turning wave through the flock; each language turns it its own way.
   Likes are thousands of tiny lifts, reposts echo the last wave, follows pull the flock tighter.
   Overall activity above its recent average makes the birds faster and more restless.
   Touch or move the pointer to be the falcon: the flock parts around you. */

var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d',{alpha:false});
var wake=window.__wake||function(){};
var statusEl=document.getElementById('status'),rateEl=document.getElementById('rates');

/* ---------- flock ---------- */
var small=Math.min(screen.width,screen.height)<700||(navigator.hardwareConcurrency||4)<=4;
var NMAX=small?3200:6500,N=NMAX;
var px=new Float32Array(NMAX),py=new Float32Array(NMAX),pz=new Float32Array(NMAX);
var vx=new Float32Array(NMAX),vy=new Float32Array(NMAX),vz=new Float32Array(NMAX);
var ax=new Float32Array(NMAX),ay=new Float32Array(NMAX),az=new Float32Array(NMAX);
var seedv=new Float32Array(NMAX);
for(var i=0;i<NMAX;i++){
  var a=Math.random()*6.283,r=Math.pow(Math.random(),.5)*.5;
  px[i]=Math.cos(a)*r*1.5;py[i]=.12+Math.sin(a)*r*.55;pz[i]=(Math.random()-.5)*.6;
  vx[i]=.35+(Math.random()-.5)*.1;vy[i]=(Math.random()-.5)*.1;vz[i]=(Math.random()-.5)*.1;
  seedv[i]=Math.random();
}
/* spatial grid for neighbour search */
var R=.09,SEP=.042,K=10;
var GX=48,GY=34,GZ=26,X0=-2.04,Y0=-1.2,Z0=-1.1;
var NC=GX*GY*GZ,cellCount=new Int32Array(NC),cellStart=new Int32Array(NC+1),order=new Int32Array(NMAX),cellOf=new Int32Array(NMAX);
function cellIndex(x,y,z){
  var cx=Math.floor((x-X0)/R),cy=Math.floor((y-Y0)/R),cz=Math.floor((z-Z0)/R);
  if(cx<0)cx=0;else if(cx>=GX)cx=GX-1;
  if(cy<0)cy=0;else if(cy>=GY)cy=GY-1;
  if(cz<0)cz=0;else if(cz>=GZ)cz=GZ-1;
  return (cz*GY+cy)*GX+cx;
}

/* the roost: where the flock is drawn, wandering slowly across the sky */
var roost={x:0,y:.15,z:0};
var waves=[],lastWave=null;
var falcon={x:0,y:0,on:0,last:0};
var gather=0,agit=0;

function hash01(s){var h=2166136261;for(var i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return (h>>>0)/4294967296;}

function addWave(strength,turn,src){
  var b=src!=null?src:Math.floor(Math.random()*N);
  waves.push({x:px[b],y:py[b],z:pz[b],r:0,s:strength,turn:turn,lift:(Math.random()-.5)*.6});
  if(waves.length>14)waves.shift();
  lastWave=b;
}

function step(dt,t){
  var i,j;
  /* roost wanders on a slow Lissajous so the flock sweeps the sky */
  roost.x=Math.sin(t*.053)*.9+Math.sin(t*.021+1.)*.35;
  roost.y=.12+Math.sin(t*.071+2.)*.2+Math.sin(t*.031)*.08;
  roost.z=Math.sin(t*.043)*.35;
  /* bin */
  cellCount.fill(0);
  for(i=0;i<N;i++){var c=cellIndex(px[i],py[i],pz[i]);cellOf[i]=c;cellCount[c]++;}
  var acc=0;for(i=0;i<NC;i++){cellStart[i]=acc;acc+=cellCount[i];}cellStart[NC]=acc;
  cellCount.fill(0);
  for(i=0;i<N;i++){var c2=cellOf[i];order[cellStart[c2]+cellCount[c2]++]=i;}

  var vmax=.62+agit*.35,vmin=.30+agit*.08;
  var wAl=1.5,wCo=.7+gather*1.0,wSe=2.6,wRoost=.26+gather*.7;
  var R2=R*R,S2=SEP*SEP;
  for(i=0;i<N;i++){
    var x=px[i],y=py[i],z=pz[i];
    var cx=Math.floor((x-X0)/R),cy=Math.floor((y-Y0)/R),cz=Math.floor((z-Z0)/R);
    var n=0,sax=0,say=0,saz=0,scx=0,scy=0,scz=0,ssx=0,ssy=0,ssz=0;
    outer:
    for(var dz=-1;dz<=1;dz++){var zz=cz+dz;if(zz<0||zz>=GZ)continue;
      for(var dy=-1;dy<=1;dy++){var yy=cy+dy;if(yy<0||yy>=GY)continue;
        for(var dx=-1;dx<=1;dx++){var xx=cx+dx;if(xx<0||xx>=GX)continue;
          var cc=(zz*GY+yy)*GX+xx,e=cellStart[cc+1];
          for(var k=cellStart[cc];k<e;k++){
            j=order[k];if(j===i)continue;
            var ex=px[j]-x,ey=py[j]-y,ez=pz[j]-z,d2=ex*ex+ey*ey+ez*ez;
            if(d2>R2)continue;
            sax+=vx[j];say+=vy[j];saz+=vz[j];scx+=ex;scy+=ey;scz+=ez;
            if(d2<S2){var dd=Math.sqrt(d2)+1e-5,push=(SEP-dd)/(SEP*dd);ssx-=ex*push;ssy-=ey*push;ssz-=ez*push;}
            if(++n>=K)break outer;
          }
        }
      }
    }
    var fx=0,fy=0,fz=0;
    if(n>0){
      var invn=1/n;
      fx+=(sax*invn-vx[i])*wAl;fy+=(say*invn-vy[i])*wAl;fz+=(saz*invn-vz[i])*wAl;
      fx+=scx*invn*wCo*2;fy+=scy*invn*wCo*2;fz+=scz*invn*wCo*2;
      fx+=ssx*wSe;fy+=ssy*wSe;fz+=ssz*wSe;
    }
    /* roost pull, stronger for birds far out */
    var rx=roost.x-x,ry=roost.y-y,rz=roost.z-z,rd=Math.sqrt(rx*rx+ry*ry+rz*rz)+1e-4;
    var pull=wRoost*Math.min(2.2,Math.max(0,rd-.25)*2.2);
    fx+=rx/rd*pull;fy+=ry/rd*pull*1.1;fz+=rz/rd*pull;
    /* keep above the marsh */
    if(y<-.42)fy+=(-.42-y)*6;
    if(y>.78)fy-=(y-.78)*6;
    /* falcon */
    if(falcon.on>.01){
      var qx=x-falcon.x,qy=y-falcon.y,q2=qx*qx+qy*qy;
      if(q2<.09){var qd=Math.sqrt(q2)+1e-3,fs=falcon.on*(1-qd/.3)*9;fx+=qx/qd*fs;fy+=qy/qd*fs;fz+=(seedv[i]-.5)*fs*.6;}
    }
    /* turning waves travelling through the flock */
    for(var w=0;w<waves.length;w++){
      var wv=waves[w],wx=x-wv.x,wy=y-wv.y,wz=z-wv.z,wd=Math.sqrt(wx*wx+wy*wy+wz*wz),sh=wd-wv.r;
      if(sh>-.05&&sh<.05){
        var g=wv.s*(1-Math.abs(sh)/.05);
        /* rotate heading around the vertical axis, plus a lift */
        fx+=-vz[i]*wv.turn*g*7;fz+=vx[i]*wv.turn*g*7;fy+=wv.lift*g*3;
      }
    }
    ax[i]=fx;ay[i]=fy;az[i]=fz;
  }
  for(i=0;i<N;i++){
    var nvx=vx[i]+ax[i]*dt,nvy=vy[i]+ay[i]*dt,nvz=vz[i]+az[i]*dt;
    var sp=Math.sqrt(nvx*nvx+nvy*nvy+nvz*nvz)+1e-6;
    var tgt=sp>vmax?vmax:(sp<vmin?vmin:sp);
    nvx*=tgt/sp;nvy*=tgt/sp;nvz*=tgt/sp;
    vx[i]=nvx;vy[i]=nvy;vz[i]=nvz;
    px[i]+=nvx*dt;py[i]+=nvy*dt;pz[i]+=nvz*dt;
  }
  for(var w2=waves.length-1;w2>=0;w2--){var wv2=waves[w2];wv2.r+=dt*.55;wv2.s*=Math.pow(.55,dt);if(wv2.r>2.2||wv2.s<.02)waves.splice(w2,1);}
}

/* ---------- sky ---------- */
var SKIES=[
  {top:[52,58,96],mid:[160,128,170],low:[246,176,140],sun:[255,214,170]},
  {top:[40,48,82],mid:[132,112,160],low:[232,150,150],sun:[255,196,168]},
  {top:[34,52,84],mid:[112,132,170],low:[222,190,170],sun:[255,226,196]},
  {top:[58,46,88],mid:[170,118,150],low:[250,160,110],sun:[255,204,150]}
];
function lerp(a,b,t){return a+(b-a)*t;}
function skyAt(t){
  var u=(t*.004)%SKIES.length,i0=Math.floor(u),f=u-i0,f2=f*f*(3-2*f);
  var A=SKIES[i0],B=SKIES[(i0+1)%SKIES.length],o={};
  ['top','mid','low','sun'].forEach(function(k){o[k]=[lerp(A[k][0],B[k][0],f2),lerp(A[k][1],B[k][1],f2),lerp(A[k][2],B[k][2],f2)];});
  return o;
}
function rgb(c,m){m=m||1;return 'rgb('+Math.round(Math.min(255,c[0]*m))+','+Math.round(Math.min(255,c[1]*m))+','+Math.round(Math.min(255,c[2]*m))+')';}
/* marsh silhouette: reeds and a far tree line, built once per resize */
var ground=null;
function buildGround(W,H){
  var g=document.createElement('canvas');g.width=W;g.height=H;var c=g.getContext('2d');
  var base=H*.86;
  c.fillStyle='#120f17';c.beginPath();c.moveTo(0,H);
  for(var x=0;x<=W;x+=4){
    var tx=x/W,h=Math.sin(tx*5.3)*.003+Math.sin(tx*13.7+1.3)*.0015+Math.sin(tx*2.1+.4)*.006;
    var trees=(Math.max(0,Math.sin(tx*1.7+.6)-.35)*.05)*(.55+.45*Math.abs(Math.sin(tx*97.)*Math.sin(tx*41.3)));
    c.lineTo(x,base-H*(h+trees));
  }
  c.lineTo(W,H);c.closePath();c.fill();
  c.strokeStyle='#120f17';c.lineCap='round';
  for(var k=0;k<W/2.2;k++){
    var rx=Math.random()*W,rh=H*(.02+Math.pow(Math.random(),2.2)*.09),lean=(Math.random()-.5)*rh*.35;
    c.lineWidth=Math.max(1,W/1400)*(.6+Math.random());
    c.beginPath();c.moveTo(rx,base+H*.02);c.quadraticCurveTo(rx+lean*.3,base-rh*.5,rx+lean,base-rh);c.stroke();
  }
  return g;
}

var W=1,H=1,DPR=1,S=1,CX=0,CY=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  var w=Math.max(1,Math.round(canvas.clientWidth*DPR)),h=Math.max(1,Math.round(canvas.clientHeight*DPR));
  if(w===W&&h===H)return;
  W=w;H=h;canvas.width=w;canvas.height=h;
  S=Math.min(W/3.3,H/2.0);CX=W*.5;CY=H*.47;
  ground=buildGround(W,H);
}
window.addEventListener('resize',resize);resize();

function draw(t,act){
  var sk=skyAt(t);
  var g=ctx.createLinearGradient(0,0,0,H);
  var lift=1+act*.08;
  g.addColorStop(0,rgb(sk.top));g.addColorStop(.55,rgb(sk.mid,lift));g.addColorStop(.86,rgb(sk.low,lift));g.addColorStop(1,rgb(sk.low,.8));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  /* low sun glow */
  var sx=W*(.5+.3*Math.sin(t*.011)),rg=ctx.createRadialGradient(sx,H*.88,0,sx,H*.88,H*.7);
  rg.addColorStop(0,'rgba('+sk.sun.map(Math.round).join(',')+',.55)');rg.addColorStop(1,'rgba('+sk.sun.map(Math.round).join(',')+',0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);

  /* birds: short strokes along their heading, darker and larger when nearer */
  var buckets=[[],[],[]];
  for(var i=0;i<N;i++){var b=pz[i]<-.12?0:(pz[i]<.12?1:2);buckets[b].push(i);}
  var widths=[.9,1.15,1.45],alphas=[.55,.78,.95],lens=[2.3,2.9,3.6];
  for(var bk=0;bk<3;bk++){
    var list=buckets[bk];if(!list.length)continue;
    ctx.strokeStyle='rgba(18,14,24,'+alphas[bk]+')';ctx.lineWidth=widths[bk]*DPR;ctx.lineCap='round';
    ctx.beginPath();
    for(var q=0;q<list.length;q++){
      var k=list[q],persp=1/(1+pz[k]*-.35);
      var X=CX+px[k]*S*persp,Y=CY-py[k]*S*persp;
      var hx=vx[k],hy=-vy[k],hl=Math.sqrt(hx*hx+hy*hy)+1e-4;
      /* wingbeat: the stroke flickers shorter and longer */
      var flap=.75+.35*Math.sin(t*22+seedv[k]*40);
      var L=lens[bk]*DPR*persp*flap;
      ctx.moveTo(X-hx/hl*L,Y-hy/hl*L*.6-L*.25);ctx.lineTo(X,Y);ctx.lineTo(X+hx/hl*L,Y+hy/hl*L*.6-L*.25);
    }
    ctx.stroke();
  }
  ctx.drawImage(ground,0,0);
}

/* ---------- pointer: the falcon ---------- */
function toWorld(ev){var r=canvas.getBoundingClientRect();return [((ev.clientX-r.left)*DPR-CX)/S,(CY-(ev.clientY-r.top)*DPR)/S];}
canvas.addEventListener('pointermove',function(ev){var p=toWorld(ev);falcon.x=p[0];falcon.y=p[1];falcon.last=performance.now();if(ev.pointerType==='mouse'||ev.buttons)falcon.on=1;});
canvas.addEventListener('pointerdown',function(ev){var p=toWorld(ev);falcon.x=p[0];falcon.y=p[1];falcon.on=1;falcon.last=performance.now();});

/* ---------- Bluesky ---------- */
var COLL=['app.bsky.feed.post','app.bsky.feed.like','app.bsky.feed.repost','app.bsky.graph.follow'];
var URLS=[
  'wss://jetstream.us-east.bsky.network/xrpc/network.bsky.jetstream.subscribeEvents?'+COLL.map(function(c){return 'collections='+c;}).join('&'),
  'wss://jetstream2.us-east.bsky.network/subscribe?'+COLL.map(function(c){return 'wantedCollections='+c;}).join('&'),
  'wss://jetstream1.us-west.bsky.network/subscribe?'+COLL.map(function(c){return 'wantedCollections='+c;}).join('&')
];
var cnt={post:0,like:0,repost:0,follow:0},rate={post:0,like:0,repost:0,follow:0},mean=0,live=false,sim=false,gotAny=false,ws=null,urlIdx=0,simTimer=null;
var pendingLikes=0,waveBudget=0;
function onEvent(kind,rec){
  cnt[kind]++;
  if(kind==='post'){
    var lang=rec&&rec.langs&&rec.langs[0]?String(rec.langs[0]):'und';
    var len=rec&&typeof rec.text==='string'?rec.text.length:80;
    waveBudget+=1;
    /* not every post can start a wave or the flock would never settle: roughly one in eight does */
    if(waveBudget>=8){waveBudget=0;addWave(.35+.5*Math.min(1,len/280),(hash01(lang)-.5)*2);}
  }else if(kind==='like'){pendingLikes++;}
  else if(kind==='repost'){if(lastWave!=null&&Math.random()<.15)addWave(.18,(Math.random()-.5)*1.4,lastWave);}
  else if(kind==='follow'){gather=Math.min(1,gather+.004);}
}
function parse(data){
  var d;try{d=JSON.parse(data);}catch(e){return;}
  var c=null,op=null,rec=null;
  if(d&&d.payload){c=d.payload.collection;op=d.payload.operation;rec=d.payload.record;}
  else if(d&&d.commit){c=d.commit.collection;op=d.commit.operation;rec=d.commit.record;}
  if(!c||op!=='create')return;
  gotAny=true;
  if(!live){live=true;sim=false;clearTimeout(simTimer);statusEl.textContent='Live from Bluesky';}
  if(c==='app.bsky.feed.post')onEvent('post',rec);
  else if(c==='app.bsky.feed.like')onEvent('like',rec);
  else if(c==='app.bsky.feed.repost')onEvent('repost',rec);
  else if(c==='app.bsky.graph.follow')onEvent('follow',rec);
}
function connect(){
  if(urlIdx>=URLS.length){startSim();return;}
  var u=URLS[urlIdx];gotAny=false;
  try{ws=new WebSocket(u);}catch(e){urlIdx++;connect();return;}
  var timer=setTimeout(function(){if(!gotAny){try{ws.close();}catch(e){}urlIdx++;connect();}},7000);
  ws.onmessage=function(m){parse(m.data);};
  ws.onerror=function(){};
  ws.onclose=function(){
    clearTimeout(timer);
    if(live){live=false;statusEl.textContent='Reconnecting to Bluesky';setTimeout(connect,3000);}
    else if(!gotAny){urlIdx++;connect();}
  };
}
function startSim(){
  if(sim||live)return;sim=true;
  statusEl.textContent='Preview with simulated activity';
  var langs=['en','en','en','ja','ja','pt','de','es','fr','ko'];
  (function tick(){
    if(!sim)return;
    var t=performance.now()/1000,m=1+.45*Math.sin(t*.09)+.25*Math.sin(t*.31);
    function pois(l){var n=0,p=Math.exp(-l),s=1;if(l>30)return Math.max(0,Math.round(l+Math.sqrt(l)*(Math.random()*2-1)));do{s*=Math.random();n++;}while(s>p);return n-1;}
    var k,n=pois(9*m);for(k=0;k<n;k++)onEvent('post',{langs:[langs[Math.floor(Math.random()*langs.length)]],text:new Array(1+Math.floor(Math.random()*280)).join('a')});
    n=pois(60*m);for(k=0;k<n;k++)onEvent('like',null);
    n=pois(6*m);for(k=0;k<n;k++)onEvent('repost',null);
    n=pois(8*m);for(k=0;k<n;k++)onEvent('follow',null);
    simTimer=setTimeout(tick,250);
  })();
}
connect();
setTimeout(function(){if(!live)startSim();},15000);

/* ---------- loop ---------- */
var calm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var clock=Math.random()*400,last=performance.now(),frames=0,slowFrames=0,shown=0;
function frame(now){
  requestAnimationFrame(frame);
  resize();
  var rdt=Math.min(.05,(now-last)/1000);last=now;clock+=rdt;
  /* rates, per second, smoothed over a few seconds */
  if(rdt>0)for(var k in cnt){rate[k]+=(cnt[k]/rdt-rate[k])*.02;cnt[k]=0;}
  var total=rate.post+rate.like+rate.repost+rate.follow;
  mean+=(total-mean)*(mean===0?1:.002);
  var surge=mean>1?Math.max(-1,Math.min(1,(total-mean)/mean*1.5)):0;
  agit+=(Math.max(0,.35+surge*.6)-agit)*.01;
  gather*=Math.pow(.7,rdt);
  /* likes: tiny lifts to random birds */
  var lifts=Math.min(pendingLikes,60);pendingLikes=0;
  for(var l=0;l<lifts;l++){var b=Math.floor(Math.random()*N);vy[b]+=.05;}
  if(falcon.on>0&&now-falcon.last>400)falcon.on*=Math.pow(.05,rdt);
  var dt=rdt*(calm?.5:1);
  /* two half steps keep fast birds stable */
  step(dt*.5,clock);step(dt*.5,clock);
  draw(clock,agit);
  /* if the device struggles, quietly fly with fewer birds */
  if(rdt>.03)slowFrames++;frames++;
  if(frames===90){if(slowFrames>40&&N>1500)N=Math.floor(N*.75);frames=0;slowFrames=0;}
  if(++shown%30===0)rateEl.textContent=Math.round(rate.post)+' posts/s · '+Math.round(rate.like)+' likes/s · '+Math.round(rate.follow)+' follows/s';
}
requestAnimationFrame(frame);
})();

</script>
